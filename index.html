    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 2500); 
            for (let i = 0; i < numStars; i++) {
                stars.push({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 1.5 + 0.1, alpha: Math.random(), speed: Math.random() * 0.05 + 0.01, color: Math.random() > 0.8 ? '#3b82f6' : '#ffffff' });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color === '#ffffff' ? `rgba(255, 255, 255, ${star.alpha})` : `rgba(59, 130, 246, ${star.alpha})`; ctx.fill();
                star.alpha += (Math.random() - 0.5) * 0.05;
                if(star.alpha < 0.1) star.alpha = 0.1; if(star.alpha > 0.8) star.alpha = 0.8;
                star.y -= star.speed; if (star.y < 0) { star.y = height; star.x = Math.random() * width; }
            });
            requestAnimationFrame(drawStars);
        }
        window.addEventListener('resize', resize); resize(); drawStars();
    </script>

                        { q: "Что такое Астрологические Дома?", a: "12 секторов, представляющих различные сферы жизни." }
                    ]
                }
            }
        };

        // --- UI COMPONENTS ---
        const InputField = ({ label, type, value, onChange, placeholder, required = true }) => (
            <div className="mb-6">
                <label className="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2">{label}</label>
                <input type={type} value={value} onChange={onChange} placeholder={placeholder} required={required}
                    className="w-full bg-transparent border-b border-white/20 pb-2 text-lg font-light text-white focus:border-white transition-colors duration-300 outline-none placeholder-gray-600" />
            </div>
        );

        const Button = ({ children, onClick, type = "button", variant = "primary" }) => {
            const variants = { primary: "bg-white text-black hover:bg-gray-200", glass: "glass-panel text-white hover:bg-white/10" };
            return (
                <motion.button whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }} type={type} onClick={onClick}
                    className={`px-8 py-4 rounded-full text-sm uppercase tracking-widest font-medium transition-all ${variants[variant]}`}>
                    {children}
                </motion.button>
            );
        };

        const Loader = ({ messages, onComplete }) => {
            const [index, setIndex] = useState(0);
            useEffect(() => {
                const timer = setInterval(() => setIndex(prev => (prev + 1) % messages.length), 1000);
                const completeTimer = setTimeout(() => onComplete(), messages.length * 1000);
                return () => { clearInterval(timer); clearTimeout(completeTimer); };
            }, [messages, onComplete]);

            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-mystic-950/90 backdrop-blur-xl">
                    <motion.div animate={{ rotate: 360 }} transition={{ duration: 4, repeat: Infinity, ease: "linear" }} className="w-24 h-24 mb-10 rounded-full border border-mystic-accent/30 border-t-mystic-accent" />
                    <AnimatePresence mode="wait">
                        <motion.p key={index} initial={{ y: 10, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -10, opacity: 0 }} className="text-sm tracking-[0.2em] text-gray-300 uppercase">
                            {messages[index]}
                        </motion.p>
                    </AnimatePresence>
                </motion.div>
            );
        };

        const TopNav = ({ user, view, setView, lang, setLang, t }) => (
            <motion.nav initial={{ y: -100 }} animate={{ y: 0 }} className="fixed top-0 w-full z-40 bg-mystic-950/80 backdrop-blur-xl border-b border-white/5 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="text-xl font-light tracking-widest cursor-pointer text-white" onClick={() => setView('dashboard')}>ASTROLOGUM</div>
                <div className="flex gap-6 text-xs tracking-widest uppercase text-gray-400">
                    <span onClick={() => setView('dashboard')} className={`cursor-pointer hover:text-white ${view==='dashboard'?'text-mystic-accent':''}`}>{t.nav.modules}</span>
                    <span onClick={() => setView('quizzes')} className={`cursor-pointer hover:text-white ${view==='quizzes'?'text-mystic-accent':''}`}>{t.nav.quizzes}</span>
                    <span onClick={() => setView('faq')} className={`cursor-pointer hover:text-white ${view==='faq'?'text-mystic-accent':''}`}>{t.nav.faq}</span>
                </div>
                <div className="flex items-center gap-6">
                    <div className="flex gap-3 text-xs tracking-widest">
                        {['az', 'en', 'ru'].map(l => (
                            <span key={l} onClick={() => setLang(l)} className={`cursor-pointer uppercase ${lang === l ? 'text-mystic-accent' : 'text-gray-500 hover:text-white'}`}>{l}</span>
                        ))}
                    </div>
                    {user && <div onClick={() => setView('profile')} className="text-xs uppercase text-white border border-white/20 px-4 py-2 rounded-full cursor-pointer hover:bg-white/10">{user.name}</div>}
                </div>
            </motion.nav>
        );

        // --- VIEWS ---
        const Dashboard = ({ onAction, t }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="pt-36 pb-20 px-6 max-w-7xl mx-auto">
                <h1 className="text-4xl md:text-5xl font-light mb-4">{t.dash.title1} <span className="text-mystic-accent italic">{t.dash.title2}</span></h1>
                <p className="text-gray-400 font-light mb-12">{t.dash.desc}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {t.modules.map(mod => (
                        <motion.div key={mod.id} whileHover={{ scale: 1.02 }} onClick={() => onAction(mod.action || `panel_${mod.id}`)}
                            className="glass-panel p-6 rounded-2xl cursor-pointer hover:border-mystic-accent/40 flex flex-col justify-between h-40">
                            <div className="flex justify-between mb-2">
                                <h3 className="text-lg text-gray-200">{mod.title}</h3>
                                <span className="text-xl opacity-50">{mod.icon}</span>
                            </div>
                            <p className="text-xs text-gray-400">{mod.desc}</p>
                        </motion.div>
                    ))}
                </div>
            </motion.div>
        );

        const CompatibilityView = ({ onBack, t, user }) => {
            const [partner, setPartner] = useState('');
            const [analyzed, setAnalyzed] = useState(false);

            if (!analyzed) return (
                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="pt-36 pb-20 px-6 max-w-2xl mx-auto text-center">
                    <button onClick={onBack} className="text-xs uppercase text-gray-500 hover:text-white mb-10">← {t.panel.back}</button>
                    <h2 className="text-3xl font-light mb-8">Dynamic Compatibility</h2>
                    <div className="glass-panel p-10 rounded-3xl">
                        <InputField label={t.comp.askName} type="text" value={partner} onChange={(e)=>setPartner(e.target.value)} placeholder={t.comp.placeholder} />
                        <Button onClick={() => partner && setAnalyzed(true)}>{t.comp.btn}</Button>
                    </div>
                </motion.div>
            );

            return (
                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="pt-36 pb-20 px-6 max-w-4xl mx-auto">
                    <button onClick={onBack} className="text-xs uppercase text-gray-500 hover:text-white mb-10">← {t.panel.back}</button>
                    <div className="glass-panel p-10 md:p-16 rounded-[3rem]">
                        <h2 className="text-xs uppercase tracking-[0.3em] text-mystic-accent mb-6">{user.name} & {partner}</h2>
                        <h1 className="text-3xl md:text-4xl font-light mb-10 text-gradient">{t.comp.resultTitle}</h1>
                        <div className="space-y-6 text-gray-300 font-light leading-relaxed">
                            <p className="bg-white/5 p-6 rounded-2xl border border-white/5">{t.comp.r1}</p>
                            <p className="bg-white/5 p-6 rounded-2xl border border-white/5">{t.comp.r2}</p>
                            <p className="bg-mystic-accent/10 p-6 rounded-2xl border border-mystic-accent/30 italic">{t.comp.r3}</p>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const StandardPanel = ({ type, onBack, t }) => {
            const data = t.deep[type] || t.deep.love; // fallback
            const title = t.modules.find(m => m.id === type)?.title || type;
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="pt-36 pb-20 px-6 max-w-4xl mx-auto">
                    <button onClick={onBack} className="text-xs tracking-widest uppercase text-gray-500 hover:text-white mb-12">← {t.panel.back}</button>
                    <div className="glass-panel p-10 md:p-16 rounded-[3rem]">
                        <h2 className="text-xs uppercase tracking-[0.3em] text-mystic-accent mb-6">{title}</h2>
                        <h1 className="text-2xl md:text-4xl font-light mb-10 text-gradient">"{data.overview}"</h1>
                        <div className="space-y-8 text-gray-300 font-light">
                            <div><h3 className="text-xs uppercase text-white/50 mb-2">{t.panel.psyDepth}</h3><p>{data.deep}</p></div>
                            <div className="bg-mystic-900/30 p-6 rounded-2xl border border-mystic-accent/20"><h3 className="text-xs uppercase text-white/50 mb-2">{t.panel.pattern}</h3><p className="italic">"{data.pattern}"</p></div>
                            <div><h3 className="text-xs uppercase text-white/50 mb-2">{t.panel.advice}</h3><p>{data.advice}</p></div>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const QuizzesView = ({ t }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="pt-36 pb-20 px-6 max-w-5xl mx-auto">
                <h1 className="text-4xl font-light mb-10">{t.quizzes.title}</h1>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {t.quizzes.list.map((quiz, i) => (
                        <div key={i} className="glass-panel p-6 rounded-2xl border border-white/5 hover:border-mystic-accent/40 cursor-pointer transition flex items-center h-24">
                            <p className="text-sm font-medium">{quiz}</p>
                        </div>
                    ))}
                </div>
            </motion.div>
        );

        const FaqView = ({ t }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="pt-36 pb-20 px-6 max-w-3xl mx-auto">
                <h1 className="text-4xl font-light mb-10">{t.faq.title}</h1>
                <div className="space-y-4">
                    {t.faq.list.map((item, i) => (
                        <div key={i} className="glass-panel p-6 rounded-2xl border border-white/5">
                            <h3 className="text-lg font-medium mb-2 text-mystic-accent">{item.q}</h3>
                            <p className="text-gray-300 font-light">{item.a}</p>
                        </div>
                    ))}
                </div>
            </motion.div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [lang, setLang] = useState('az');
            const [user, setUser] = useState({ name: 'User' }); // Set default to skip Auth for quick testing, set to null for prod
            const [view, setView] = useState('dashboard'); // auth, dashboard, quizzes, faq, panel_xxx
            const [loadingState, setLoadingState] = useState({ isLoading: false, target: null });
            const t = T[lang];

            // If user is null, show Auth (skipped in this demo state setup for quick UX view, logic is same)
            useEffect(() => { if (!user) setView('auth'); }, [user]);

            const handleAction = (actionId) => {
                if(actionId === 'export' || actionId === 'ai') return alert("Premium Feature");
                setLoadingState({ isLoading: true, target: actionId, msgs: [t.loaders.l2, t.loaders.l3] });
            };

            const renderView = () => {
                if (view === 'auth') return <AuthScreen t={t} onLogin={u => { setUser(u); setView('dashboard'); }} />;
                if (view === 'dashboard') return <Dashboard onAction={handleAction} t={t} />;
                if (view === 'quizzes') return <QuizzesView t={t} />;
                if (view === 'faq') return <FaqView t={t} />;
                if (view === 'panel_compatibility') return <CompatibilityView onBack={()=>setView('dashboard')} t={t} user={user} />;
                if (view.startsWith('panel_')) return <StandardPanel type={view.replace('panel_', '')} onBack={() => setView('dashboard')} t={t} />;
                if (view === 'profile') return <div className="pt-40 text-center"><Button onClick={() => setUser(null)}>Logout</Button></div>;
                return null;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <AnimatePresence mode="wait">
                        {loadingState.isLoading && <Loader messages={loadingState.msgs} onComplete={() => { setView(loadingState.target); setLoadingState({ isLoading: false }); }} />}
                    </AnimatePresence>
                    {!loadingState.isLoading && user && <TopNav user={user} view={view} setView={setView} lang={lang} setLang={setLang} t={t} />}
                    <main className="flex-grow w-full relative z-10">
                        <AnimatePresence mode="wait">
                            {!loadingState.isLoading && <motion.div key={view} className="w-full h-full">{renderView()}</motion.div>}
                        </AnimatePresence>
                    </main>
                    {!loadingState.isLoading && user && (
                        <footer className="w-full border-t border-white/5 py-12 mt-10 px-6 bg-[#020617]/80 backdrop-blur-xl relative z-30">
                            <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-gray-500 text-xs">
                                <div><h4 className="text-white mb-4 tracking-widest uppercase">ASTROLOGUM</h4><p>{t.footer.sub}</p></div>
                                <div><ul className="space-y-2">{t.footer.links.slice(0,5).map(l => <li key={l} className="cursor-pointer hover:text-white">{l}</li>)}</ul></div>
                                <div><ul className="space-y-2">{t.footer.links.slice(5).map(l => <li key={l} className="cursor-pointer hover:text-white">{l}</li>)}</ul></div>
                                <div className="md:text-right"><p className="text-white mb-2">{t.footer.created}</p><p>{t.footer.copy}</p></div>
                            </div>
                        </footer>
                    )}
                </div>
            );
        };

        const AuthScreen = ({ onLogin, t }) => {
            const [name, setName] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center pt-20 px-6">
                    <div className="glass-panel p-10 rounded-3xl w-full max-w-md text-center">
                        <h1 className="text-4xl font-light mb-8 text-white">{t.auth.title}</h1>
                        <input type="text" placeholder={t.auth.namePl} value={name} onChange={e=>setName(e.target.value)} className="w-full bg-transparent border-b border-white/20 pb-2 mb-8 text-white outline-none text-center text-lg" />
                        <Button onClick={() => onLogin({name: name || 'Ziyarətçi'})}>{t.auth.start}</Button>
                    </div>
                </div>
            )
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
