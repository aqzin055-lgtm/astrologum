// Cosmic Loader Component
function CosmicLoader({ onComplete }) {
  const { lang } = useLang();
  const [messageIdx, setMessageIdx] = useState(0);
  const [progress, setProgress] = useState(0);
  const messages = translations[lang].loader.messages;
  useEffect(() => {
    const msgInt = setInterval(() => setMessageIdx(i => (i+1)%messages.length), 1000);
    const progInt = setInterval(() => setProgress(p => { if(p>=100) { clearInterval(progInt); clearInterval(msgInt); setTimeout(onComplete,300); return 100; } return p+3; }), 85);
    return () => { clearInterval(msgInt); clearInterval(progInt); };
  }, [onComplete, messages.length]);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-2xl">
      <div className="text-center max-w-md px-6">
        <div className="relative w-32 h-32 mx-auto mb-8">
          <div className="absolute inset-0 rounded-full border border-white/20 animate-spin-slow"></div>
          <div className="absolute inset-2 rounded-full border-t-2 border-blue-400 animate-spin-slow" style={{animationDuration:'2s'}}></div>
          <div className="absolute inset-0 flex items-center justify-center text-3xl animate-pulse-glow">✨</div>
        </div>
        <motion.p key={messageIdx} initial={{opacity:0,y:10}} animate={{opacity:1,y:0}} className="text-xl font-light text-white/90">{messages[messageIdx]}</motion.p>
        <div className="w-full h-[2px] bg-white/20 rounded-full mt-6 overflow-hidden"><div className="h-full bg-gradient-to-r from-blue-400 to-white" style={{width:`${progress}%`}}></div></div>
        <p className="text-xs text-white/40 mt-3">{progress}%</p>
      </div>
    </div>
  );
}

        <div className="hidden md:flex gap-8 text-sm font-light">
          <button onClick={()=>navigate('/category/love')} className="hover:text-white/80">{t.nav.love}</button>
          <button onClick={()=>navigate('/category/future')} className="hover:text-white/80">{t.nav.future}</button>
          <button onClick={()=>navigate('/category/money')} className="hover:text-white/80">{t.nav.money}</button>
          <button onClick={()=>navigate('/category/career')} className="hover:text-white/80">{t.nav.career}</button>
          <button onClick={()=>navigate('/settings')} className="hover:text-white/80">{t.nav.settings}</button>
        </div>
        <div className="relative">
          <button onClick={()=>setShowLang(!showLang)} className="glass-card px-4 py-2 rounded-full text-sm">{lang.toUpperCase()}</button>
          {showLang && <div className="absolute right-0 mt-2 glass-card bg-black/80 rounded-2xl overflow-hidden min-w-[100px]">
            {['en','ru','az'].map(l=><button key={l} onClick={()=>{setLang(l); setShowLang(false);}} className={`block w-full text-left px-4 py-2 hover:bg-white/10 text-sm ${lang===l?'text-white':'text-white/60'}`}>{l.toUpperCase()}</button>)}
          </div>}
        </div>
      </nav>
      <main className="pt-28">{children}</main>
      <footer className="border-t border-white/10 py-8 text-center text-white/30 text-sm mt-20">Astralis — cosmic reflection for the self-aware. © 2025</footer>
    </div>
  );
}

// App Router
function App() {
  const [lang, setLang] = useState('en');
  useEffect(()=>{ const saved = localStorage.getItem('astralis-lang'); if(saved) setLang(saved); },[]);
  const handleSetLang = (l)=>{ setLang(l); localStorage.setItem('astralis-lang',l); };
  return (
    <LangContext.Provider value={{lang, setLang:handleSetLang}}>
      <BrowserRouter>
        <Routes>
          <Route path="/" element={<Layout><HomePage /></Layout>} />
          <Route path="/category/:categoryId" element={<Layout><CategoryPage /></Layout>} />
          <Route path="/result/:categoryId/:subpanelId" element={<Layout><ResultPage /></Layout>} />
          <Route path="/settings" element={<Layout><SettingsPage /></Layout>} />
        </Routes>
      </BrowserRouter>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
