function getEnergyLevel(birthdate, sign) {
    const base = (parseInt(birthdate?.split('-').join('') || '0') % 100);

    if (sign.element === 'Su') energy += 5;
    if (sign.element === 'Hava') energy += 10;
    if (sign.element === 'Torpaq') energy -= 5;
    energy = Math.min(95, Math.max(25, energy));
    return energy;
}

// ========== BÜRCÜ TAPMA ==========
function getZodiacSign(date) {
    if (!date) return signs[0];
    const month = parseInt(date.split('-')[1]);
    const day = parseInt(date.split('-')[2]);
    for (const sign of signs) {
        if (sign.startMonth === 1 && month === 12) {
            if ((month === 12 && day >= sign.startDay) || (month === 1 && day <= sign.endDay)) return sign;
        } else if (sign.startMonth <= sign.endMonth) {
            if (month === sign.startMonth && day >= sign.startDay) return sign;
            if (month === sign.endMonth && day <= sign.endDay) return sign;
            if (month > sign.startMonth && month < sign.endMonth) return sign;
        } else {
            if (month >= sign.startMonth || month <= sign.endMonth) return sign;
        }
    }
    return signs[9];
}

                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xl">💫</span>
                        <span class="text-white/40 text-[9px] tracking-wide">KARMİK BAĞLANTIN</span>
                    </div>
                    <p class="text-white/70 text-sm">Ruh yoldaşının adı <span class="text-blue-300 font-medium">"${userKarmic.letter}"</span> hərfi ilə başlayır</p>
                    <p class="text-white/30 text-[10px] mt-2">${userKarmic.desc}</p>
                </div>
                
                <!-- Gizli Mesaj -->
                <div class="sky-card rounded-2xl p-5 mb-4 border border-blue-500/30 bg-blue-500/5">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xl">🔮</span>
                        <span class="text-blue-300/50 text-[9px] tracking-wide">SADƏCƏ SƏNİN ÜÇÜN MESAJ</span>
                    </div>
                    <p class="text-white/80 text-sm italic leading-relaxed">"${userSecretMessage}"</p>
                </div>
                
                <!-- Ulduz Falı -->
                <div class="sky-card rounded-2xl p-5 mb-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xl">🌠</span>
                        <span class="text-white/40 text-[9px] tracking-wide">ULDUZ FALIN</span>
                    </div>
                    <p class="text-white/70 text-sm">${userStarFortune}</p>
                </div>
                
                <!-- Günlük Bürc Proqnozu -->
                <div class="sky-card rounded-2xl p-5 mb-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xl">🌟</span>
                        <span class="text-white/40 text-[9px] tracking-wide">GÜNLÜK PROQNOZ</span>
                    </div>
                    <p class="text-white/70 text-sm leading-relaxed">${getDailyHoroscope(userSign, userName)}</p>
                </div>
                
                <!-- Bürc Detayları -->
                <div class="sky-card rounded-2xl p-5">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-xl">📖</span>
                        <span class="text-white/40 text-[9px] tracking-wide">BÜRCÜN HAQQINDA</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-[11px]">
                        <div><span class="text-white/30">Element:</span> <span class="text-white/70">${userSign.element}</span></div>
                        <div><span class="text-white/30">Planet:</span> <span class="text-white/70">${userSign.planet}</span></div>
                        <div><span class="text-white/30">Daş:</span> <span class="text-white/70">${userSign.gemstone}</span></div>
                        <div><span class="text-white/30">Şanslı rəng:</span> <span class="text-white/70">${userSign.luckyColors[0]}</span></div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-white/10">
                        <p class="text-white/40 text-[10px]">${userSign.traits}</p>
                    </div>
                </div>
                
                <!-- Yenidən başla düyməsi -->
                <div class="text-center mt-6">
                    <button onclick="resetJourney()" class="px-5 py-2 bg-white/5 border border-white/10 rounded-full text-white/30 text-[9px] hover:bg-white/10 transition">⟳ YENİDƏN SƏFƏRƏ BAŞLA</button>
                </div>
            </div>
        `;
    }
}

function startJourney() {
    const name = document.getElementById('welcomeName')?.value;
    const date = document.getElementById('welcomeDate')?.value;
    
    if (!name || !date) {
        alert('Zəhmət olmasa adını və doğum tarixini daxil et');
        return;
    }
    
    userName = name;
    birthdate = date;
    userSign = getZodiacSign(date);
    userSoulColor = getSoulColor(date);
    userSecretMessage = getSecretMessage(date, name);
    userSecretAbility = getSecretAbility(date, userSign);
    userKarmic = getKarmicConnection(date, userSign);
    userEnergy = getEnergyLevel(date, userSign);
    userStarFortune = getStarFortune(date, name);
    step = 'dashboard';
    render();
}

function resetJourney() {
    step = 'welcome';
    userName = '';
    birthdate = '';
    userSign = null;
    render();
}

render();
</script>
</body>
</html>
