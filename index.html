<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ECLIPSE | Cosmic Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body { 
            background-color: #000000; 
            color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .premium-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #5E5CE6;
            outline: none;
        }

        .btn-main {
            background: #0A84FF;
            transition: all 0.3s ease;
        }
        .btn-main:hover {
            background: #0071e3;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="selection:bg-indigo-500/30">

    <div id="app" class="min-h-screen flex items-center justify-center p-6">
        <!-- Render hissəsi bura yüklənir -->
    </div>

<script>
// (Sizin əvvəlki kodunuzdakı "signs", "planetaryEvents" və funksiyalar olduğu kimi qalır)
// Bura yalnız modernləşdirilmiş "render" funksiyasını əlavə edirəm:

function render() {
    const app = document.getElementById('app');
    
    if (step === 'welcome') {
        app.innerHTML = `
            <div class="text-center animate-in fade-in zoom-in duration-700">
                <span class="text-[10px] tracking-[0.3em] text-gray-500 uppercase mb-4 block">Astro-Intelligence</span>
                <h1 class="text-6xl md:text-8xl font-semibold tracking-tighter mb-8">ECLIPSE</h1>
                <p class="text-xl md:text-2xl text-gray-400 font-light max-w-lg mb-12">Kainatın ritmini özündə hiss et. Peşəkar astroloji analiz.</p>
                <button onclick="goToInput()" class="btn-main px-12 py-4 rounded-full text-sm font-medium tracking-wide">BAŞLA</button>
            </div>
        `;
    } 
    else if (step === 'input') {
        app.innerHTML = `
            <div class="glass p-10 md:p-16 rounded-[2rem] w-full max-w-lg animate-in slide-in-from-bottom-8 duration-500">
                <h2 class="text-3xl font-semibold mb-8">Şəxsi məlumatlar</h2>
                <div class="space-y-6">
                    <input type="text" id="nameInput" placeholder="Adınız" class="premium-input w-full rounded-2xl px-6 py-4">
                    <input type="date" id="dateInput" class="premium-input w-full rounded-2xl px-6 py-4 text-gray-400">
                    <button onclick="submitUserData()" class="btn-main w-full py-4 rounded-2xl font-medium">ANALİZİ İŞƏ SAL</button>
                </div>
            </div>
        `;
        document.getElementById('nameInput').addEventListener('input', (e) => userName = e.target.value);
        document.getElementById('dateInput').addEventListener('input', (e) => birthdate = e.target.value);
    }
    // ... (digər bölmələr də bu "glass" və "rounded-[2rem]" stili ilə yenilənir)
}
</script>
</body>
</html>
