        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body {
            background: #000000;
            background-image: radial-gradient(circle at 25% 40%, rgba(30, 30, 40, 0.4) 0%, #000000 90%);
            min-height: 100vh;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slowDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.15; }
            50% { transform: translate(20px, -20px) scale(1.1); opacity: 0.25; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.15; }
        }
        
        @keyframes subtleGlow {
            0%, 100% { text-shadow: 0 0 5px rgba(255,255,255,0.05); }
            50% { text-shadow: 0 0 20px rgba(100,100,150,0.15); }
        }
        
        @keyframes borderPulse {
            0%, 100% { border-color: rgba(255,255,255,0.08); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
            50% { border-color: rgba(150,150,200,0.2); box-shadow: 0 0 20px rgba(100,100,150,0.1); }
        }
        
        .animate-fadeUp { animation: fadeUp 0.7s cubic-bezier(0.23, 1, 0.32, 1); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .drift-bg { animation: slowDrift 15s ease-in-out infinite; }
        .glow-text { animation: subtleGlow 4s ease-in-out infinite; }
        .card-pulse { animation: borderPulse 3s ease-in-out infinite; }
        
        /* Black glass cards */
        .onyx-card {
            background: rgba(5, 5, 8, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        
        .onyx-card:hover {
            background: rgba(10, 10, 18, 0.85);
            border-color: rgba(180, 180, 220, 0.15);
            transform: translateY(-3px);
        }
        
        /* Input styling - pure black */
        .dark-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        
        .dark-input:focus {
            outline: none;
            border-color: rgba(180, 180, 220, 0.4);
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 0 3px rgba(100, 100, 150, 0.1);
        }
        
        /* Minimal scroll */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 10px; }
        
        /* Selection */
        ::selection { background: rgba(150, 150, 200, 0.2); }
    </style>
</head>

    };
    
    return horoscopes[period]?.[category] || horoscopes.daily.general;
}

// ========== RUH YOLDAŞI UYUMU (Uzun analiz) ==========
function getSoulmateCompatibility(sign1, sign2, name1, name2) {
    let score = 0;
    let analysis = '';
    
    // Element uyumu
    if (sign1.element === sign2.element) {
        score += 35;
        analysis = `İki ${sign1.element} elementi. Bu, ruhların eyni kökdən gəldiyini göstərir. Siz bir-birinizi sözsüz başa düşürsünüz. Sanki eyni ruhun iki fərqli bədəndə yaşayan yarılarısınız. ${sign1.name} və ${sign2.name} birlikdə olduqda kainatda bir harmoniyan yaranır. Bu birlik çox güclüdür, amma bəzən partlayıcı da ola bilər. Öfkeye sahib çıxmasını bilin.`;
    } else if ((sign1.element === 'Od' && sign2.element === 'Hava') || (sign1.element === 'Hava' && sign2.element === 'Od')) {
        score += 32;
        analysis = `Od və Hava - mükəmməl birlik! ${sign1.element === 'Od' ? sign1.name : sign2.name} atəşi yandırır, ${sign1.element === 'Hava' ? sign1.name : sign2.name} küləyi isə bu atəşi bütün dünyaya yayır. Birlikdə böyük işlər bacarır, bir-birinizi heç vaxt darıxdırmırsınız. Sizin münasibətiniz macəra, səyahət, yeni kəşflərlə doludur. Ancaq bəzən hava çox güclü əsəndə od sönə bilər. Dengeyi tapın.`;
    } else if ((sign1.element === 'Torpaq' && sign2.element === 'Su') || (sign1.element === 'Su' && sign2.element === 'Torpaq')) {
        score += 38;
        analysis = `Torpaq və Su - kainatın ən qədim ikilisi. ${sign1.element === 'Torpaq' ? sign1.name : sign2.name} torpağı, ${sign1.element === 'Su' ? sign1.name : sign2.name} suyu təmsil edir. Su olmasa torpaq quruyar, torpaq olmasa su axıb gedər. Bir-birinizi tamamlayırsınız. Bu münasibət çox sağlam, dərin və sabitdir. Birlikdə çiçəklər yetişdirirsiniz. Həyatı birlikdə gözəlləşdirirsiniz. Bu, nikah, ailə, ömürlük birlik üçün ən ideal kombinasiyadır.`;
    } else {
        score += 25;
        analysis = `Fərqli elementlər. Siz bir-birinizi tamamlayan ziddiyyətlərsiniz. ${sign1.name} səma, ${sign2.name} yer kimi. Və ya gecə ilə gündüz. Hər şeyə fərqli baxırsınız, amma bu fərqlilik sizi inkişaf etdirir. Sizin münasibətiniz böyümək, öyrənmək, dönüşmək üçündür. Bəzən çətin olacaq, amma hər çətinlik sizə bir dərs verəcək. Əgər bu dərsləri öyrənsəniz, birlikdə xoşbəxt ola bilərsiniz.`;
    }
    
    // Planet uyumu bonusu
    if (sign1.planet === sign2.planet) {
        score += 12;
        analysis += ` Ayrıca, hər ikiniz eyni planet (${sign1.planet}) tərəfindən idarə olunursunuz. Bu, ortaq dəyərlər, ortaq hədəflər deməkdir. Sizin üçün "normal" olan şeylər başqaları üçün "qəribə" ola bilər. Bu ortaq anlayış sizi çox yaxın edir.`;
    } else if ((sign1.planet === 'Mars' && sign2.planet === 'Venera') || (sign1.planet === 'Venera' && sign2.planet === 'Mars')) {
        score += 15;
        analysis += ` ${sign1.planet === 'Mars' ? sign1.name : sign2.name} Mars (müharibə) və ${sign1.planet === 'Venera' ? sign1.name : sign2.name} Venera (sevgi). Bu, sözün əsl mənasında "müharibə və sülh" münasibətidir. Bəzən mübarizə aparırsınız, bəzən eşq edirsiniz. Bu dinamik sizi heç vaxt cansıxıcı etmir. Hər an bir sürpriz var. Bu birlik çox ehtiraslıdır.`;
    }
    
    // Rəqəm uyumu
    const numBonus = Math.floor(Math.random() * 10);
    score += numBonus;
    score = Math.min(score, 100);
    
    let verdict = '';
    if (score >= 85) verdict = '💜 MÜKƏMMƏL UYUM - Ruh eşinizi tapmış ola bilərsiniz! Bu əlaqə ömürlük ola bilər.';
    else if (score >= 70) verdict = '💖 ÇOX YAXŞI UYUM - Bu birlikdə böyük potensial var. Üzərində işləsəniz, ömürlük xoşbəxtlik mümkündür.';
    else if (score >= 55) verdict = '💗 YAXŞI UYUM - Anlaşırsınız, amma bəzi fərqlilikləri qəbul etməyi öyrənməlisiniz. Bu mümkündür.';
    else if (score >= 40) verdict = '💔 ORTA UYUM - Bu əlaqə inkişaf üçündür. Birlikdə böyüyə bilərsiniz, amma çalışmaq lazımdır.';
    else verdict = '✨ KARMİK ƏLAQƏ - Bu əlaqə sizə bir dərs verəcək. Ayrılsanız belə, bir-birinizi unutmayacaqsınız.';
    
    // Uyum zamanı (nə vaxt olacaq?)
    const timing = ["Bu ay içində", "3 ay ərzində", "Bu yay", "Bu ilin sonuna qədər", "Növbəti dolunayda", "Artıq yaxınlaşdınız, fərqində olun", "Karmik olaraq bağlısınız, vaxtı gələcək"][Math.floor(Math.random() * 7)];
    
    return { score, analysis, verdict, timing };
}

// ========== BÜRCÜ TAPMA ==========
function getZodiacSign(date) {
    const month = parseInt(date.split('-')[1]);
    const day = parseInt(date.split('-')[2]);
    
    for (const sign of signs) {
        if (sign.startMonth === 1 && month === 12) {
            if ((month === 12 && day >= sign.startDay) || (month === 1 && day <= sign.endDay)) return sign;
        } else if (sign.startMonth <= sign.endMonth) {
            if (month === sign.startMonth && day >= sign.startDay) return sign;
            if (month === sign.endMonth && day <= sign.endDay) return sign;
            if (month > sign.startMonth && month < sign.endMonth) return sign;
        } else {
            if (month >= sign.startMonth || month <= sign.endMonth) return sign;
        }
    }
    return signs[9];
}
