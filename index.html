// ---------- STARS GENERATION ----------
function generateStars() {
  const container = document.getElementById('stars');
  if (container && container.children.length === 0) {
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 2 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = Math.random() * 3 + 2 + 's';
      container.appendChild(star);
    }
  }
}

// Cosmic Loader Component
const CosmicLoader = ({ onComplete }) => {
  const { lang } = useLang();
  const [progress, setProgress] = useState(0);
  const [msgIdx, setMsgIdx] = useState(0);
  const messages = translations[lang].loader.messages;
  
  useEffect(() => {
    const msgInt = setInterval(() => setMsgIdx(i => (i + 1) % messages.length), 900);
    const progInt = setInterval(() => {
      setProgress(p => {
        if (p >= 100) {
          clearInterval(progInt);
          clearInterval(msgInt);
          setTimeout(onComplete, 200);
          return 100;
        }
        return p + 2.5;
      });
    }, 70);
    return () => { clearInterval(msgInt); clearInterval(progInt); };
  }, [onComplete, messages.length]);
  
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl">
      <div className="text-center px-6">
        <div className="cosmic-loader mx-auto mb-6"></div>
        <p className="text-xl font-light text-white/90">{messages[msgIdx]}</p>
        <div className="w-64 h-0.5 bg-white/10 rounded-full mt-6 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-blue-400 to-white transition-all duration-100" style={{ width: `${progress}%` }}></div>
        </div>
        <p className="text-xs text-white/30 mt-3">{Math.floor(progress)}%</p>
      </div>
    </div>
  );
};

            <div className="mt-4 text-right text-xs text-blue-300/80">KƏŞF ET →</div>
          </div>
        ))}
      </div>
    </div>
  );
};

// Settings Page
const SettingsPage = () => {
  const { lang, setLang } = useLang();
  const langs = [{code:'az', label:'Azərbaycanca', flag:'🇦🇿'},{code:'en', label:'English', flag:'🇬🇧'},{code:'ru', label:'Русский', flag:'🇷🇺'}];
  return (
    <div className="max-w-md mx-auto px-4 py-16">
      <div className="glass-premium p-6 md:p-8">
        <h2 className="text-2xl font-light mb-6">Dil / Language</h2>
        <div className="space-y-2">
          {langs.map(l => (
            <button key={l.code} onClick={() => setLang(l.code)} className={`w-full flex justify-between items-center px-4 py-3 rounded-xl transition ${lang === l.code ? 'bg-white/10 border border-white/20' : 'hover:bg-white/5'}`}>
              <span><span className="mr-2">{l.flag}</span>{l.label}</span>
              {lang === l.code && <span className="text-blue-300 text-sm">✓</span>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
};

// Home Page
const HomePage = () => {
  const { lang } = useLang();
  const t = translations[lang];
  const navigate = useNavigate();
  
  return (
    <div>
      <section className="relative min-h-[85vh] flex items-center justify-center px-6 text-center">
        <div className="relative z-10 max-w-4xl">
          <h1 className="text-4xl md:text-6xl lg:text-7xl font-bold text-gradient leading-tight">{t.hero.headline}</h1>
          <p className="text-white/50 text-lg mt-6 max-w-xl mx-auto">{t.hero.subtitle}</p>
          <div className="flex flex-col sm:flex-row gap-4 justify-center mt-8">
            <button onClick={() => navigate('/category/love')} className="px-6 py-3 rounded-full bg-white/10 backdrop-blur border border-white/20 hover:bg-white/20 transition">{t.hero.cta}</button>
            <button onClick={() => document.getElementById('panels')?.scrollIntoView({behavior:'smooth'})} className="px-6 py-3 rounded-full glass-premium hover:bg-white/5 transition">{t.hero.secondary}</button>
          </div>
        </div>
      </section>
      
      <section id="panels" className="max-w-7xl mx-auto px-4 py-16">
        <h2 className="text-2xl md:text-3xl font-light text-center mb-3">Kosmik ölçülərin</h2>
        <p className="text-white/40 text-center mb-10">Hər panel emosional xəritənin bir tərəfini açır</p>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
          {categories.map(cat => (
            <div key={cat.id} onClick={() => navigate(`/category/${cat.id}`)} className="glass-premium p-5 cursor-pointer">
              <div className="text-3xl mb-2">{cat.icon}</div>
              <h3 className="text-lg font-medium">{t.panelTitles[cat.id]}</h3>
              <p className="text-white/40 text-xs mt-2 line-clamp-3">{t.panelDesc[cat.id]}</p>
              <div className="mt-3 text-right text-blue-300/50 text-xs">KƏŞF ET →</div>
            </div>
          ))}
        </div>
      </section>
    </div>
  );
};

// Layout
const Layout = ({ children }) => {
  const { lang, setLang } = useLang();
  const t = translations[lang];
  const navigate = useNavigate();
  const [showLang, setShowLang] = useState(false);
  
  useEffect(() => { generateStars(); }, []);
  
  return (
    <div className="min-h-screen">
      <div className="cosmic-bg"></div>
      <div id="stars" className="stars"></div>
      <nav className="fixed top-0 w-full z-50 backdrop-blur-2xl bg-black/40 border-b border-white/10 px-4 md:px-8 py-4 flex justify-between items-center">
        <div onClick={() => navigate('/')} className="text-xl md:text-2xl font-semibold tracking-tight cursor-pointer text-gradient">Astralis</div>
        <div className="hidden md:flex gap-6 text-sm">
          <button onClick={() => navigate('/category/love')} className="hover:text-white/80">{t.nav.love}</button>
          <button onClick={() => navigate('/category/future')} className="hover:text-white/80">{t.nav.future}</button>
          <button onClick={() => navigate('/category/money')} className="hover:text-white/80">{t.nav.money}</button>
          <button onClick={() => navigate('/category/career')} className="hover:text-white/80">{t.nav.career}</button>
          <button onClick={() => navigate('/settings')} className="hover:text-white/80">{t.nav.settings}</button>
        </div>
        <div className="relative">
          <button onClick={() => setShowLang(!showLang)} className="glass-premium px-3 py-1.5 rounded-full text-xs">{lang.toUpperCase()}</button>
          {showLang && (
            <div className="absolute right-0 mt-2 glass-premium bg-black/90 rounded-xl overflow-hidden min-w-[90px]">
              {['az','en','ru'].map(l => (
                <button key={l} onClick={() => { setLang(l); setShowLang(false); }} className={`block w-full text-left px-3 py-2 text-sm hover:bg-white/10 ${lang === l ? 'text-white' : 'text-white/60'}`}>{l.toUpperCase()}</button>
              ))}
            </div>
          )}
        </div>
      </nav>
      <main className="pt-24 md:pt-28 pb-12">{children}</main>
      <footer className="border-t border-white/10 py-6 text-center text-white/20 text-xs">ASTRALIS — KOSMİK KƏŞFİYYAT | © 2025</footer>
    </div>
  );
};

// App
const App = () => {
  const [lang, setLang] = useState('az');
  useEffect(() => { const saved = localStorage.getItem('astralis-lang'); if (saved && ['az','en','ru'].includes(saved)) setLang(saved); }, []);
  const handleSetLang = (l) => { setLang(l); localStorage.setItem('astralis-lang', l); };
  
  return (
    <LangContext.Provider value={{ lang, setLang: handleSetLang }}>
      <BrowserRouter>
        <Routes>
          <Route path="/" element={<Layout><HomePage /></Layout>} />
          <Route path="/category/:categoryId" element={<Layout><CategoryPage /></Layout>} />
          <Route path="/result/:categoryId/:subpanelId" element={<Layout><ResultPage /></Layout>} />
          <Route path="/settings" element={<Layout><SettingsPage /></Layout>} />
        </Routes>
      </BrowserRouter>
    </LangContext.Provider>
  );
};

// Render
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
