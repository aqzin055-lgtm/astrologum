const getResult = (id) => resultsDB[id] || resultsDB.love_res;

// ========== CONTEXT ==========
const LanguageContext = createContext();

// ========== COSMIC LOADER ==========
const CosmicLoader = ({ onComplete }) => {
  const { language } = useLanguage();
  const [progress, setProgress] = useState(0);
  const [msgIdx, setMsgIdx] = useState(0);
  const msgs = translations[language].loader.messages;
  
  useEffect(() => {
    const msgInt = setInterval(() => setMsgIdx(i => (i+1)%msgs.length), 900);
    const progInt = setInterval(() => {
      setProgress(p => { if(p>=100) { clearInterval(progInt); clearInterval(msgInt); setTimeout(onComplete, 200); return 100; } return p+2.5; });
    }, 70);
    return () => { clearInterval(msgInt); clearInterval(progInt); };
  }, [onComplete, msgs.length]);
  
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl">
      <div className="text-center max-w-md px-6">
        <div className="cosmic-ring mx-auto mb-8"><div className="ring-outer"></div><div className="ring-middle"></div><div className="ring-inner"></div><div className="absolute inset-0 flex items-center justify-center text-3xl animate-pulse">✨</div></div>
        <p className="text-xl font-light text-white/90 tracking-wide">{msgs[msgIdx]}</p>
        <div className="w-full h-[2px] bg-white/10 rounded-full mt-6 overflow-hidden"><div className="h-full bg-gradient-to-r from-cosmic-light to-blue-400 transition-all duration-100" style={{ width: `${progress}%` }}></div></div>
        <p className="text-[10px] text-white/30 mt-3 tracking-widest">{Math.floor(progress)}%</p>
      </div>
    </div>
  );
};

// ========== APP ==========
const App = () => {

  useEffect(() => { const saved = localStorage.getItem('astralis-lang'); if(saved && ['az','en','ru'].includes(saved)) setLanguage(saved); }, []);
  const handleSetLang = (lang) => { setLanguage(lang); localStorage.setItem('astralis-lang', lang); };
  
  return (
    <LanguageContext.Provider value={{ language, setLanguage: handleSetLang, t: translations[language] }}>
      <BrowserRouter>
        <Routes>
          <Route path="/" element={<Layout><HomePage /></Layout>} />
          <Route path="/category/:categoryId" element={<Layout><CategoryPage /></Layout>} />

          <Route path="/settings" element={<Layout><SettingsPage /></Layout>} />
        </Routes>
      </BrowserRouter>
    </LanguageContext.Provider>
  );
};
