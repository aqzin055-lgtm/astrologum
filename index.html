// ========== COSMIC LOADER COMPONENT ==========
const CosmicLoader = ({ onComplete }) => {
  const { language } = useLanguage();
  const [messageIndex, setMessageIndex] = useState(0);
  const [progress, setProgress] = useState(0);
  const messages = translations[language].loader.messages;
  
  useEffect(() => {
    const msgInterval = setInterval(() => setMessageIndex(i => (i + 1) % messages.length), 900);
    const progInterval = setInterval(() => {
      setProgress(p => { if (p >= 100) { clearInterval(progInterval); clearInterval(msgInterval); setTimeout(onComplete, 250); return 100; } return p + 2.5; });
    }, 70);
    return () => { clearInterval(msgInterval); clearInterval(progInterval); };
  }, [onComplete, messages.length]);
  
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl">
      <div className="text-center max-w-md px-6">
        <div className="cosmic-ring mx-auto mb-8">
          <div className="ring-outer"></div>
          <div className="ring-middle"></div>
          <div className="ring-inner"></div>
          <div className="absolute inset-0 flex items-center justify-center text-3xl animate-pulse">✨</div>
        </div>
        <motion.p key={messageIndex} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} className="text-xl font-light text-white/90 tracking-wide">{messages[messageIndex]}</motion.p>
        <div className="w-full h-[2px] bg-white/10 rounded-full mt-6 overflow-hidden">
          <motion.div className="h-full bg-gradient-to-r from-cosmic-light to-blue-400" style={{ width: `${progress}%` }} />
        </div>
        <p className="text-[10px] text-white/30 mt-3 tracking-widest">{Math.floor(progress)}%</p>
      </div>
    </div>
  );
};

// ========== STARFIELD GENERATION ==========
const generateStars = () => {
  const starsContainer = document.getElementById('stars');
  if (starsContainer) {
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.width = Math.random() * 2 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = Math.random() * 3 + 2 + 's';
      starsContainer.appendChild(star);
    }
  }
};
