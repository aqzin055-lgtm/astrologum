<!DOCTYPE html>
<html lang="az">
<head>

        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: #0a0a0e;

                radial-gradient(ellipse at 20% 30%, rgba(88, 28, 135, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 70%, rgba(76, 29, 149, 0.15) 0%, transparent 55%);
            min-height: 100vh;
        }
        
        /* Apple-style smooth animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes softGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }

        /* Apple-style card hover */
        .apple-card {
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);

            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);

            background: rgba(30, 30, 45, 0.5);
            border-color: rgba(139, 92, 246, 0.2);

        /* Apple-style input */

            border: 0.5px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;

            outline: none;
            border-color: #6b21a5;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 1px rgba(107, 33, 165, 0.3);
        }
        
        /* Apple-style button */
        .apple-button {
            background: linear-gradient(135deg, rgba(107, 33, 165, 0.9), rgba(76, 29, 149, 0.9));
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        
        .apple-button:hover {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(91, 33, 182, 0.9));
            transform: scale(0.98);
        }
        
        /* Glassmorphism navigation */
        .apple-nav {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
        }
        
        .nav-item {
            transition: all 0.2s ease;
            border-radius: 100px;
        }
        
        .nav-item.active {
            background: rgba(107, 33, 165, 0.5);
            backdrop-filter: blur(10px);
        }
        
        /* Custom scrollbar - Apple style */
        ::-webkit-scrollbar {
            width: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(107, 33, 165, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 33, 165, 0.7);
        }
        
        /* Typography */
        .apple-title {
            letter-spacing: -0.02em;
            font-weight: 600;
        }
        
        .apple-subtitle {
            letter-spacing: 0.3em;
            font-weight: 400;
        }
    </style>
</head>

// ========== BÜRCÜ TAP ==========
function getZodiacSign(date) {
    const month = parseInt(date.split('-')[1]);
    const day = parseInt(date.split('-')[2]);
    
    for (const sign of signs) {
        if (sign.startMonth === 1 && month === 12) {
            if ((month === 12 && day >= sign.startDay) || (month === 1 && day <= sign.endDay)) return sign;
        } else if (sign.startMonth <= sign.endMonth) {
            if (month === sign.startMonth && day >= sign.startDay) return sign;
            if (month === sign.endMonth && day <= sign.endDay) return sign;
            if (month > sign.startMonth && month < sign.endMonth) return sign;
        } else {
            if (month >= sign.startMonth || month <= sign.endMonth) return sign;
        }
    }
    return signs[9];
}

function getLoveCompatibility(sign1, sign2) {
    if (sign1.element === sign2.element) return `✨ Mükəmməl uyum! Hər ikiniz ${sign1.element} elementindənsiniz. Bu birlikdəlik güclü və dərindir.`;
    if ((sign1.element === 'Od' && sign2.element === 'Hava') || (sign1.element === 'Hava' && sign2.element === 'Od')) return `🌟 Əla uyum! Od+Hava bir-birini alovlandırır. Birlikdə böyük işlər bacararsınız.`;
    if ((sign1.element === 'Torpaq' && sign2.element === 'Su') || (sign1.element === 'Su' && sign2.element === 'Torpaq')) return `💎 Çox yaxşı uyum! Torpaq+Su bir-birini bəsləyir.`;
    return `🌙 Maraqlı uyum! Fərqli elementlər cəlb edir. Bu birlikdəlikdə öyrənəcəyiniz çox şey var.`;
}

function getWeeklyPrediction(sign) {
    const predictions = [
        `🔮 Bu həftə ${sign.planet} planeti sizin üçün xüsusi bir enerji daşıyır. Karyeranızda irəliləyiş mümkündür.`,
        `✨ ${sign.name}, bu həftə keçmişlə bağlı xəbərlər ala bilərsiniz. Açıq fikirli olun.`,
        `🌊 Enerjiniz yüksələcək. Yeni insanlarla tanış olmaq üçün ideal vaxtdır.`
    ];
    return predictions[Math.floor(Math.random() * predictions.length)];
}

            </div>

            <div class="apple-card rounded-2xl p-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-green-400">📈</span>
                    <h3 class="text-xs tracking-wide text-gray-400">BU AY ÜÇÜN TÖVSİYƏ</h3>
                </div>
                <p class="text-white/80 text-sm leading-relaxed">${userSign.element} elementi sizi bu ayda yeni layihələrə doğru aparır. ${userSign.planet} planetinin enerjisindən istifadə edin.</p>
            </div>

            <div class="apple-card rounded-2xl p-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-amber-400">✨</span>
                    <h3 class="text-xs tracking-wide text-gray-400">GÜCLÜ TƏRƏFLƏRİNİZ</h3>
                </div>
                <p class="text-white/80 text-sm">${userSign.traits}</p>
            </div>
        `;
    }
}

function calculateLove() {
    const partnerName = document.getElementById('partnerNameInput')?.value;
    const partnerDate = document.getElementById('partnerDateInput')?.value;
    const loveResultDiv = document.getElementById('loveResult');
    
    if (!partnerName || !partnerDate) {
        if (loveResultDiv) loveResultDiv.innerHTML = `<div class="bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-center text-red-300 text-xs">Zəhmət olmasa hər iki məlumatı daxil edin</div>`;
        return;
    }
    
    const partnerSign = getZodiacSign(partnerDate);
    const compatibility = getLoveCompatibility(userSign, partnerSign);
    
    if (loveResultDiv) {
        loveResultDiv.innerHTML = `
            <div class="bg-gradient-to-r from-purple-900/20 to-pink-900/20 rounded-2xl p-5 border border-purple-500/20 animate-fadeUp mt-4">
                <div class="text-center mb-2">
                    <span class="text-2xl">${compatibility.includes('Mükəmməl') ? '💜' : compatibility.includes('Əla') ? '💖' : '💗'}</span>
                </div>
                <p class="text-center text-white/80 text-sm">${partnerName} ilə uyumunuz:</p>
                <p class="text-center text-purple-300 text-sm mt-2">${compatibility}</p>
                <p class="text-center text-gray-500 text-[10px] mt-2">${partnerSign.name} · ${partnerSign.element}</p>
            </div>
        `;
    }
}

function submitUserData() {
    if (!userName || !birthdate) return;
    userSign = getZodiacSign(birthdate);
    step = 'dashboard';
    render();
}

function goToInput() {
    step = 'input';
    render();
}

function resetApp() {
    step = 'welcome';
    userName = '';
    birthdate = '';
    userSign = null;
    currentSection = 'daily';
    render();
}

function renderDashboard() {
    renderDashboardContent();
}

render();
</script>
</body>
</html>
