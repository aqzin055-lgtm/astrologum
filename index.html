    <script>
        // Starfield Background
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 2500); 
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width, y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.1, alpha: Math.random(),
                    speed: Math.random() * 0.05 + 0.01,
                    color: Math.random() > 0.8 ? '#3b82f6' : '#ffffff'
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color === '#ffffff' ? `rgba(255, 255, 255, ${star.alpha})` : `rgba(59, 130, 246, ${star.alpha})`;
                ctx.fill();
                star.alpha += (Math.random() - 0.5) * 0.05;
                if(star.alpha < 0.1) star.alpha = 0.1;
                if(star.alpha > 0.8) star.alpha = 0.8;
                star.y -= star.speed;
                if (star.y < 0) { star.y = height; star.x = Math.random() * width; }
            });
            requestAnimationFrame(drawStars);
        }
        window.addEventListener('resize', resize);
        resize(); drawStars();
    </script>

                    { id: 'timeline', title: 'Линия Роста', desc: 'Прошлое → Настоящее → Будущее развитие.', icon: '⏳' },
                    { id: 'report', title: 'Личный Отчет', desc: 'Единый премиум PDF-отчет всех результатов.', icon: '📄', action: 'export' },
                    { id: 'ai', title: 'ИИ Рефлексия', desc: 'Диалог с ИИ. Глубокий персональный анализ.', icon: '🧠', action: 'ai' }
                ],
                deep: {
                    love: { overview: "Вы ищете глубоко значимые связи.", deep: "Повторяющиеся паттерны возникают из-за вашей неспособности полностью сдаться без ощущения абсолютной безопасности. Ваш идеальный партнер бросает вам интеллектуальный вызов, уважая свободу.", pattern: "Танец между эмоциональной интенсивностью и потребностью в независимости.", advice: "Устанавливайте свои границы заранее и четко." },
                    future: { overview: "Ваша жизнь движется к серьезным структурным сдвигам.", deep: "Прошлые выборы приносят плоды. В ближайшие месяцы сосредоточьтесь на общей картине.", pattern: "Вы всегда растете быстрее, чем окружающие.", advice: "Будьте открыты для новых опытов, покиньте зону комфорта." },
                    career: { overview: "Вы - архитектор систем.", deep: "Ваш природный талант - организовывать хаотичные структуры. Ваш аналитический ум скучает при стандартных задачах.", pattern: "Энтузиазм до создания системы, затем усталость, когда все идеально.", advice: "Сосредоточьтесь на лидерских ролях или творческих проектах." },
                    money: { overview: "Деньги для вас - математическая свобода.", deep: "Ваш финансовый потенциал высок, но отношения с деньгами связаны с безопасностью. Чрезмерная осторожность иногда мешает.", pattern: "Привычка не инвестировать без гарантий.", advice: "Позвольте себе брать творческие риски." },
                    personality: { overview: "Буря внутри, спокойствие снаружи.", deep: "Вы очень эмпатичны и вдумчивы. Люди видят в вас загадочность, силу и независимость.", pattern: "Маскировка эмоций, чтобы не казаться слабым.", advice: "Не бойтесь своей подлинности." },
                    compatibility: { overview: "Поиск профессиональной и личной синергии.", deep: "Вы цените интеллектуальную гармонию. Ваша слабость - ожидание такого же логического анализа от других.", pattern: "Поиск совместимости на ментальной, а не эмоциональной почве.", advice: "Будьте терпеливы к различным механизмам реакций людей." },
                    purpose: { overview: "Вы здесь, чтобы строить и улучшать.", deep: "Ваша миссия - не просто участвовать, а делать мир и системы вокруг вас более эффективными.", pattern: "Постоянные мысли 'как это можно улучшить'.", advice: "Делиться знаниями - ключевая часть вашей миссии." },
                    inner: { overview: "Диалоги в тишине.", deep: "Ваш самый большой внутренний конфликт - между перфекционизмом и желанием быстрых результатов.", pattern: "Чрезмерный анализ решений поздно ночью.", advice: "Разрешите себе неидеальные начала." },
                    strengths: { overview: "Ваши видимые и невидимые стороны.", deep: "Сильные стороны: Стратегическое мышление, кризисное лидерство. Слепое пятно: Перегрузка из-за того, что другие зависят от вас.", pattern: "Мысль 'быстрее сделать самому'.", advice: "Учитесь искусству делегирования." },
                    decisions: { overview: "Чаша весов рациональности и интуиции.", deep: "Опора на данные вам подходит, но часто первая интуиция указывает верный путь.", pattern: "Аналитический паралич (задержка из-за раздумий).", advice: "Используйте логику для поддержки интуиции, а не ее подавления." },
                    emotions: { overview: "Чувства, обрамленные логикой.", deep: "Вы эмоционально реагируете, но пытаетесь фильтровать это через логику. Несправедливость ранит больше всего.", pattern: "Подавление грусти работой.", advice: "Уделите время тому, чтобы просто чувствовать эмоции, не анализируя их." },
                    timeline: { overview: "Трансформация на вашей линии времени.", deep: "Прошлое: Строгие принципы. Настоящее: Осознание потенциала. Будущее: Лидерство, полная независимость.", pattern: "Радикальная смена видения каждые 3-4 года.", advice: "Используйте прошлые трудности как фундамент сейчас." }
                },
                panel: { back: "Вернуться", psyDepth: "Психологическая Глубина", pattern: "Скрытый Паттерн", advice: "Совет" },
                daily: { title: "Ежедневный Анализ", text: "Сегодня вселенная напоминает вам довериться своей интуиции. Этот маленький голос — ваш самый верный путеводитель сегодня." },
                ai: { title: "ИИ Космический Терминал", msg1: "> Загрузка матрицы пользователя...", msg2: "> Протоколы глубокого анализа активны.", msg3: "Здравствуйте. Я ИИ Astrologum. Что бы вы хотели обсудить касательно вашей карты, эмоций или будущего?", input: "Терминал ожидает сообщение... (Скоро)" },
                footer: { sub: "Архитектура Вселенной", tools: "Инструменты", aiTool: "ИИ Анализ", export: "Экспорт Карты", about: "О Нас", docs: "Тех. Документация", privacy: "Конфиденциальность" },
                loaders: { l1: "Подключение к архивам...", l2: "Сканирование базы данных...", l3: "Расшифровка паттернов...", l4: "Расчет энергии дня..." },
                alerts: { export: "Премиум-отчет создается... (Данные будут скачаны в формате PDF)", logout: "Выйти" }
            }
        };

        // --- UI COMPONENTS ---
        const InputField = ({ label, type, value, onChange, placeholder, required = true }) => (
            <div className="mb-6">
                <label className="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2">{label}</label>
                <input type={type} value={value} onChange={onChange} placeholder={placeholder} required={required}
                    className="w-full bg-transparent border-b border-white/20 pb-2 text-lg font-light text-white focus:border-white transition-colors duration-300 outline-none placeholder-gray-600" />
            </div>
        );

        const Button = ({ children, onClick, type = "button", variant = "primary", className = "" }) => {
            const variants = { primary: "bg-white text-black hover:bg-gray-200", glass: "glass-panel text-white hover:bg-white/10 border border-white/10" };
            return (
                <motion.button whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }} type={type} onClick={onClick}
                    className={`px-8 py-4 rounded-full text-sm uppercase tracking-widest font-medium transition-all duration-500 relative group ${variants[variant]} ${className}`}>
                    <span className="relative z-10">{children}</span>
                </motion.button>
            );
        };

        const Loader = ({ messages, onComplete }) => {
            const [index, setIndex] = useState(0);
            useEffect(() => {
                const timer = setInterval(() => setIndex(prev => (prev + 1) % messages.length), 1200);
                const completeTimer = setTimeout(() => onComplete(), messages.length * 1200);
                return () => { clearInterval(timer); clearTimeout(completeTimer); };
            }, [messages, onComplete]);

            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-mystic-950/90 backdrop-blur-xl">
                    <div className="relative w-32 h-32 flex items-center justify-center mb-10">
                        <motion.div animate={{ rotate: 360 }} transition={{ duration: 4, repeat: Infinity, ease: "linear" }} className="absolute inset-0 rounded-full border border-mystic-accent/30 border-t-mystic-accent" />
                    </div>
                    <AnimatePresence mode="wait">
                        <motion.p key={index} initial={{ y: 10, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -10, opacity: 0 }} className="text-sm font-light tracking-[0.2em] text-gray-300 uppercase text-center px-4">
                            {messages[index]}
                        </motion.p>
                    </AnimatePresence>
                </motion.div>
            );
        };

        const AuthScreen = ({ onLogin, lang, t }) => {
            const [formData, setFormData] = useState({ name: '', dob: '', time: '', city: '' });
            const [step, setStep] = useState(1);
            const handleNext = (e) => { e.preventDefault(); if (step < 3) setStep(step + 1); else onLogin(formData); };

            return (
                <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="min-h-screen flex items-center justify-center p-6">
                    <div className="max-w-md w-full">
                        <div className="text-center mb-12">
                            <h1 className="text-4xl font-light tracking-widest mb-3">{t.auth.title}</h1>
                            <p className="text-gray-400 font-light text-xs tracking-[0.3em] uppercase">{t.auth.sub}</p>
                        </div>
                        <form onSubmit={handleNext} className="glass-panel p-10 rounded-[2rem]">
                            <AnimatePresence mode="wait">
                                {step === 1 && (
                                    <motion.div key="1" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}>
                                        <InputField label={t.auth.name} type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder={t.auth.namePl} />
                                    </motion.div>
                                )}
                                {step === 2 && (
                                    <motion.div key="2" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}>
                                        <InputField label={t.auth.dob} type="date" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})} />
                                        <InputField label={t.auth.time} type="time" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} required={false} />
                                    </motion.div>
                                )}
                                {step === 3 && (
                                    <motion.div key="3" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}>
                                        <InputField label={t.auth.city} type="text" value={formData.city} onChange={e => setFormData({...formData, city: e.target.value})} />
                                    </motion.div>
                                )}
                            </AnimatePresence>
                            <div className="mt-8 flex justify-between items-center">
                                {step > 1 ? <button type="button" onClick={() => setStep(step - 1)} className="text-xs text-gray-500 hover:text-white uppercase tracking-widest">{t.auth.back}</button> : <div/>}
                                <Button type="submit" variant="primary">{step === 3 ? t.auth.start : t.auth.next}</Button>
                            </div>
                        </form>
                    </div>
                </motion.div>
            );
        };

        const TopNav = ({ user, setView, lang, setLang, t }) => (
            <motion.nav initial={{ y: -100 }} animate={{ y: 0 }} className="fixed top-0 w-full z-40 bg-mystic-950/70 backdrop-blur-xl border-b border-white/5 px-6 md:px-8 py-5 flex justify-between items-center">
                <div className="text-lg md:text-xl font-light tracking-widest cursor-pointer hover:text-mystic-accent transition" onClick={() => setView('dashboard')}>ASTROLOGUM</div>
                
                <div className="flex items-center gap-6">
                    {/* Language Switcher */}
                    <div className="flex gap-3">
                        {['az', 'en', 'ru'].map(l => (
                            <span key={l} onClick={() => setLang(l)} className={`cursor-pointer text-xs font-medium uppercase tracking-widest transition-colors ${lang === l ? 'text-mystic-accent' : 'text-gray-500 hover:text-white'}`}>
                                {l}
                            </span>
                        ))}
                    </div>
                    {/* Profile */}
                    <div onClick={() => setView('profile')} className="hidden md:block text-xs tracking-widest uppercase text-gray-400 border border-white/10 px-4 py-2 rounded-full cursor-pointer hover:bg-white/5 transition">
                        {user?.name || t.nav.profile}
                    </div>
                </div>
            </motion.nav>
        );

        const Dashboard = ({ onAction, t }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="pt-32 pb-20 px-6 max-w-7xl mx-auto">
                <div className="mb-16 text-center md:text-left">
                    <h1 className="text-4xl md:text-5xl font-light tracking-tight mb-4">{t.dash.title1} <span className="text-mystic-accent italic">{t.dash.title2}</span></h1>
                    <p className="text-gray-400 font-light">{t.dash.desc}</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {t.modules.map((mod) => (
                        <motion.div key={mod.id} whileHover={{ scale: 1.02 }} onClick={() => onAction(mod.action || `panel_${mod.id}`)}
                            className="group cursor-pointer glass-panel p-6 rounded-2xl border border-white/5 hover:border-mystic-accent/40 transition-colors flex flex-col justify-between h-40">
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-lg font-medium tracking-wide text-gray-200 group-hover:text-white transition">{mod.title}</h3>
                                    <span className="opacity-50 text-xl">{mod.icon}</span>
                                </div>
                                <p className="text-xs text-gray-400 font-light leading-relaxed">{mod.desc}</p>
                            </div>
                        </motion.div>
                    ))}
                </div>
            </motion.div>
        );

        const PanelDetail = ({ type, onBack, t }) => {
            const data = t.deep[type];
            if (!data) return null;

            // Find title from modules array
            const modTitle = t.modules.find(m => m.id === type)?.title || type;

            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="pt-32 pb-20 px-6 max-w-4xl mx-auto">
                    <button onClick={onBack} className="text-xs tracking-widest uppercase text-gray-500 hover:text-white transition-colors mb-12 flex items-center gap-2">← {t.panel.back}</button>
                    <div className="glass-panel p-10 md:p-16 rounded-[3rem] relative overflow-hidden">
                        <div className="absolute -top-[20%] -right-[20%] w-[50%] h-[50%] bg-mystic-accent/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <h2 className="text-xs uppercase tracking-[0.3em] text-mystic-accent mb-6">{modTitle}</h2>
                        <h1 className="text-2xl md:text-4xl font-light mb-10 leading-tight text-gradient">"{data.overview}"</h1>
                        <div className="space-y-12 mt-12 text-base font-light leading-relaxed text-gray-300">
                            <div>
                                <h3 className="text-xs uppercase tracking-[0.2em] text-white mb-4 opacity-50">{t.panel.psyDepth}</h3>
                                <p>{data.deep}</p>
                            </div>
                            <div className="bg-mystic-900/30 p-6 rounded-2xl border border-mystic-accent/20">
                                <h3 className="text-xs uppercase tracking-[0.2em] text-white mb-4 opacity-50">{t.panel.pattern}</h3>
                                <p className="text-white text-lg italic">"{data.pattern}"</p>
                            </div>
                            <div>
                                <h3 className="text-xs uppercase tracking-[0.2em] text-white mb-4 opacity-50">{t.panel.advice}</h3>
                                <p>{data.advice}</p>
                            </div>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const DailyView = ({ onBack, lang, t }) => {
            const locales = { az: 'az-AZ', en: 'en-US', ru: 'ru-RU' };
            const dateStr = new Date().toLocaleDateString(locales[lang], { year: 'numeric', month: 'long', day: 'numeric' });
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="pt-32 pb-20 px-6 max-w-3xl mx-auto text-center">
                    <button onClick={onBack} className="text-xs tracking-widest uppercase text-gray-500 hover:text-white transition-colors mb-12 inline-block">← {t.panel.back}</button>
                    <p className="text-xs tracking-[0.3em] uppercase text-mystic-accent mb-6">{dateStr}</p>
                    <h1 className="text-4xl md:text-5xl font-light mb-12">{t.daily.title}</h1>
                    <div className="glass-panel p-10 rounded-[2rem] border border-mystic-accent/20">
                        <p className="text-xl font-light leading-relaxed text-gray-200">"{t.daily.text}"</p>
                    </div>
                </motion.div>
            );
        }

        const AITerminal = ({ onClose, t }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
                <div className="glass-panel w-full max-w-3xl rounded-2xl overflow-hidden border border-mystic-accent/40 shadow-[0_0_40px_rgba(59,130,246,0.15)] flex flex-col h-[600px]">
                    <div className="p-4 border-b border-white/10 flex justify-between items-center bg-[#020617]/80">
                        <span className="text-xs tracking-[0.2em] uppercase text-mystic-accent">{t.ai.title}</span>
                        <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
                    </div>
                    <div className="flex-1 p-6 font-mono text-sm text-mystic-accent/80 overflow-y-auto bg-[#020617]/90 space-y-3">
                        <p>{t.ai.msg1}</p>
                        <p>{t.ai.msg2}</p>
                        <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 1 }} className="text-white pt-4 leading-relaxed">
                            {t.ai.msg3}
                        </motion.p>
                    </div>
                    <div className="p-4 border-t border-white/10 bg-[#020617]/80">
                        <input type="text" disabled placeholder={t.ai.input} className="w-full bg-transparent outline-none text-sm font-sans text-gray-400 cursor-not-allowed" />
                    </div>
                </div>
            </motion.div>
        );

        const Footer = ({ onAction, t }) => (
            <footer className="w-full border-t border-white/5 py-12 mt-10 px-8 bg-[#020617]/60 backdrop-blur-xl relative z-30">
                <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-10 text-gray-500">
                    <div>
                        <h4 className="text-white font-medium mb-1 tracking-widest text-sm">ASTROLOGUM</h4>
                        <p className="text-xs font-light">{t.footer.sub}</p>
                    </div>
                    <div>
                        <h4 className="text-white font-medium mb-4 text-xs uppercase tracking-widest">{t.footer.tools}</h4>
                        <ul className="space-y-3 text-xs cursor-pointer">
                            <li className="hover:text-mystic-accent transition" onClick={() => onAction('ai')}>{t.footer.aiTool}</li>
                            <li className="hover:text-white transition" onClick={() => onAction('export')}>{t.footer.export}</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="text-white font-medium mb-4 text-xs uppercase tracking-widest">{t.footer.about}</h4>
                        <ul className="space-y-3 text-xs cursor-pointer">
                            <li className="hover:text-white transition">{t.footer.docs}</li>
                            <li className="hover:text-white transition">{t.footer.privacy}</li>
                        </ul>
                    </div>
                    <div className="flex flex-col md:justify-end md:items-end text-left md:text-right">
                        <p className="text-sm font-medium text-gray-300 mb-1">Created by Agshin Ahmadli</p>
                        <p className="text-[10px] uppercase tracking-widest text-gray-600">© 2026. All Rights Reserved.</p>
                    </div>
                </div>
            </footer>
        );

        // --- MAIN APP ---
        const App = () => {
            const [lang, setLang] = useState('az');
            const [user, setUser] = useState(null);
            const [view, setView] = useState('auth'); 
            const [loadingState, setLoadingState] = useState({ isLoading: false, target: null });
            const [modal, setModal] = useState(null);

            const t = T[lang];

            const startLoading = (targetView, messages) => {
                setLoadingState({ isLoading: true, target: targetView, msgs: messages });
            };

            const handleDashboardAction = (actionId) => {
                if (actionId === 'ai') { setModal('ai'); return; }
                if (actionId === 'export') { alert(t.alerts.export); return; }
                if (actionId === 'route_daily') { startLoading('daily', [t.loaders.l4]); return; }
                
                startLoading(actionId, [t.loaders.l2, t.loaders.l3]);
            };

            const renderView = () => {
                if (view === 'auth') return <AuthScreen lang={lang} t={t} onLogin={u => { setUser(u); startLoading('dashboard', [t.loaders.l1]); }} />;
                if (view === 'dashboard') return <Dashboard onAction={handleDashboardAction} t={t} />;
                if (view.startsWith('panel_')) return <PanelDetail type={view.replace('panel_', '')} onBack={() => setView('dashboard')} t={t} />;
                if (view === 'daily') return <DailyView onBack={() => setView('dashboard')} lang={lang} t={t} />;
                if (view === 'profile') return (
                    <div className="pt-40 text-center">
                        <h2 className="text-2xl font-light">{t.nav.profile}</h2>
                        <p className="text-gray-400 mt-2">{user?.name}</p>
                        <Button className="mt-8" onClick={() => {setUser(null); setView('auth');}}>{t.alerts.logout}</Button>
                    </div>
                );
                return null;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <AnimatePresence mode="wait">
                        {loadingState.isLoading && <Loader key="loader" messages={loadingState.msgs} onComplete={() => { setView(loadingState.target); setLoadingState({ isLoading: false }); }} />}
                        {modal === 'ai' && <AITerminal key="ai" onClose={() => setModal(null)} t={t} />}
                    </AnimatePresence>

                    {!loadingState.isLoading && user && <TopNav user={user} setView={setView} lang={lang} setLang={setLang} t={t} />}

                    <main className="flex-grow w-full relative z-10">
                        <AnimatePresence mode="wait">
                            {!loadingState.isLoading && <motion.div key={view} className="w-full h-full">{renderView()}</motion.div>}
                        </AnimatePresence>
                    </main>

                    {!loadingState.isLoading && user && <Footer onAction={handleDashboardAction} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
