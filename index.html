function getLoveCompatibility(sign1, sign2) {
    let score = 0;
    let analysis = '';
    
    if (sign1.element === sign2.element) {
        score += 40;
        analysis = `✨ Mükəmməl uyum! Hər ikiniz ${sign1.element} elementindənsiniz. Ruhdaş olduğunuz üçün bir-birinizi sözsüz başa düşürsünüz.`;
    } else if ((sign1.element === 'Od' && sign2.element === 'Hava') || (sign1.element === 'Hava' && sign2.element === 'Od')) {
        score += 35;
        analysis = `🌟 Əla uyum! Od+Hava bir-birini alovlandırır. Birlikdə böyük işlər bacararsınız.`;
    } else if ((sign1.element === 'Torpaq' && sign2.element === 'Su') || (sign1.element === 'Su' && sign2.element === 'Torpaq')) {
        score += 38;
        analysis = `💎 Çox yaxşı uyum! Torpaq+Su bir-birini bəsləyir. Bu əlaqə çox sağlam və dərindir.`;
    } else {
        score += 25;
        analysis = `💫 Maraqlı uyum! Fərqli elementlər bəzən ən maraqlı birlikləri yaradır. Sizin əlaqənizdə öyrənəcəyiniz çox şey var.`;
    }
    
    score += Math.floor(Math.random() * 20);
    score = Math.min(score, 100);
    
    let verdict = '';
    if (score >= 85) verdict = 'MÜKƏMMƏL UYUM - Ruh eşinizi tapmış ola bilərsiniz!';
    else if (score >= 70) verdict = 'ÇOX YAXŞI UYUM - Bu əlaqənin uzunmüddətli potensialı var.';
    else if (score >= 55) verdict = 'YAXŞI UYUM - Üzərində işləsəniz, gözəl bir bağ qura bilərsiniz.';
    else verdict = 'KARMİK ƏLAQƏ - Bu əlaqə sizə bir dərs verəcək.';
    
    return { score, analysis, verdict };
}

function getZodiacSign(date) {
    if (!date) return signs[0];
    const month = parseInt(date.split('-')[1]);
    const day = parseInt(date.split('-')[2]);
    for (const sign of signs) {
        if (sign.startMonth === 1 && month === 12) {
            if ((month === 12 && day >= sign.startDay) || (month === 1 && day <= sign.endDay)) return sign;
        } else if (sign.startMonth <= sign.endMonth) {
            if (month === sign.startMonth && day >= sign.startDay) return sign;
            if (month === sign.endMonth && day <= sign.endDay) return sign;
            if (month > sign.startMonth && month < sign.endMonth) return sign;
        } else {
            if (month >= sign.startMonth || month <= sign.endMonth) return sign;
        }
    }
    return signs[9];
}

                <div class="sky-card rounded-2xl p-5 mb-4" style="border-left: 4px solid ${userSoulColor.hex};"><div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full" style="background: ${userSoulColor.hex}; box-shadow: 0 0 20px ${userSoulColor.hex}40;"></div><div><p class="text-white/40 text-[9px] tracking-wide">🌙 RUH RƏNGİN</p><p class="text-white/80 text-sm font-medium">${userSoulColor.name}</p><p class="text-white/30 text-[9px]">${userSoulColor.desc}</p></div></div></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4"><div class="flex justify-between items-center mb-2"><span class="text-white/40 text-[9px] tracking-wide">⚡ ENERJİ SƏVİYYƏN</span><span class="text-white/60 text-sm">${userEnergy}%</span></div><div class="w-full h-2 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-blue-400 to-indigo-400 rounded-full energy-fill" style="width: ${userEnergy}%;"></div></div><p class="text-white/30 text-[8px] mt-2">${userEnergy > 70 ? 'Enerjin zirvədə!' : userEnergy > 40 ? 'Enerjin yaxşıdır' : 'Bu gün özünə vaxt ayır'}</p></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4"><div class="flex items-center gap-2 mb-2"><span class="text-2xl">${userSecretAbility.icon}</span><span class="text-white/40 text-[9px] tracking-wide">🔮 GİZLİ QABİLİYYƏTİN</span></div><p class="text-white/70 text-sm font-medium">${userSecretAbility.name}</p><p class="text-white/40 text-[11px] mt-1">${userSecretAbility.desc}</p></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4"><div class="flex items-center gap-2 mb-2"><span class="text-xl">💫</span><span class="text-white/40 text-[9px] tracking-wide">KARMİK BAĞLANTIN</span></div><p class="text-white/70 text-sm">Ruh yoldaşının adı <span class="text-blue-300 font-medium">"${userKarmic.letter}"</span> hərfi ilə başlayır</p><p class="text-white/30 text-[10px] mt-2">${userKarmic.desc}</p></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4 border border-blue-500/30 bg-blue-500/5"><div class="flex items-center gap-2 mb-2"><span class="text-xl">🔮</span><span class="text-blue-300/50 text-[9px] tracking-wide">SADƏCƏ SƏNİN ÜÇÜN MESAJ</span></div><p class="text-white/80 text-sm italic leading-relaxed">"${userSecretMessage}"</p></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4"><div class="flex items-center gap-2 mb-2"><span class="text-xl">🌠</span><span class="text-white/40 text-[9px] tracking-wide">ULDUZ FALIN</span></div><p class="text-white/70 text-sm">${userStarFortune}</p></div>
                
                <div class="sky-card rounded-2xl p-5 mb-4"><div class="flex items-center gap-2 mb-2"><span class="text-xl">🌟</span><span class="text-white/40 text-[9px] tracking-wide">GÜNLÜK PROQNOZ</span></div><p class="text-white/70 text-sm leading-relaxed">${getDailyHoroscopeFull(userSign, userName)}</p></div>
                
                <div class="sky-card rounded-2xl p-5"><div class="flex items-center gap-2 mb-3"><span class="text-xl">📖</span><span class="text-white/40 text-[9px] tracking-wide">BÜRCÜN HAQQINDA</span></div><div class="grid grid-cols-2 gap-3 text-[11px]"><div><span class="text-white/30">Element:</span> <span class="text-white/70">${userSign.element}</span></div><div><span class="text-white/30">Planet:</span> <span class="text-white/70">${userSign.planet}</span></div><div><span class="text-white/30">Daş:</span> <span class="text-white/70">${userSign.gemstone}</span></div><div><span class="text-white/30">Tarot:</span> <span class="text-white/70">${userSign.tarot}</span></div></div><div class="mt-3 pt-3 border-t border-white/10"><p class="text-white/40 text-[10px]">${userSign.traits}</p></div></div>
                
                <!-- Sevgi Uyumu Bölməsi -->
                <div class="mt-4 sky-card rounded-2xl p-5"><div class="flex items-center gap-2 mb-3"><span class="text-xl">💕</span><span class="text-white/40 text-[9px] tracking-wide">SEVGİ UYUMU</span></div><div class="space-y-3"><input type="text" id="partnerName" placeholder="Partnyorun adı" class="dark-input w-full px-4 py-2.5 text-white/60 text-xs"><input type="date" id="partnerDate" class="dark-input w-full px-4 py-2.5 text-white/60 text-xs"><button onclick="calculateLoveCompatibility()" class="w-full py-2.5 bg-blue-500/20 border border-blue-500/30 rounded-xl text-blue-300/50 text-[10px] hover:bg-blue-500/30 transition">UYUMU HESABLA</button></div><div id="loveResult" class="mt-3"></div></div>
                
                <div class="text-center mt-6"><button onclick="resetJourney()" class="px-5 py-2 bg-white/5 border border-white/10 rounded-full text-white/30 text-[9px] hover:bg-white/10 transition">⟳ YENİDƏN BAŞLA</button></div>
            </div>
        `;
    }
}

function renderBlogList() {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = `<div class="space-y-4"><h2 class="text-xl font-light mb-6 text-white/80 text-center">Astrologiya Bloqu</h2><p class="text-white/40 text-xs text-center mb-8">30+ məqalə ilə astrologiyanın dərinliklərinə səyahət</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${blogPosts.map((post, idx) => `<button onclick="showBlogPost(${idx})" class="sky-card rounded-xl p-4 text-left hover:translate-x-1 transition"><h3 class="text-white/70 text-sm font-medium mb-1">${post.title}</h3><p class="text-white/30 text-[9px]">${post.content.substring(0, 100)}...</p><span class="inline-block mt-2 text-blue-400/30 text-[8px]">Oxu →</span></button>`).join('')}</div></div>`;
}

function renderBlogPost() {
    const post = blogPosts[currentBlogIndex];
    const app = document.getElementById('app');
    if (!app || !post) return;
    app.innerHTML = `<div class="max-w-2xl mx-auto"><button onclick="showPage('blog')" class="mb-6 text-white/40 text-[10px] hover:text-white/60 transition">← BLOQA QAYIT</button><div class="sky-card rounded-2xl p-6"><h1 class="text-2xl font-light mb-4 text-white/80">${post.title}</h1><div class="text-white/50 text-sm leading-relaxed"><p>${post.content}</p><p class="text-white/30 text-[10px] pt-4">Paylaşma tarixi: ${new Date().toLocaleDateString('az-AZ')}</p></div></div></div>`;
}

function renderPlanets() {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = `<div class="max-w-2xl mx-auto"><h2 class="text-xl font-light mb-6 text-white/80 text-center">🌌 Planet Hadisələri</h2><div class="space-y-4">${planetaryEvents.map(event => `<div class="sky-card rounded-2xl p-5"><h3 class="text-white/80 text-md font-medium mb-1">${event.name}</h3><p class="text-white/40 text-[10px] mb-2">${event.date}</p><p class="text-white/60 text-sm mb-2">${event.effect}</p><p class="text-blue-300/40 text-[10px] italic">✨ ${event.advice}</p></div>`).join('')}</div></div>`;
}

function renderPrivacy() { const app = document.getElementById('app'); if(!app) return; app.innerHTML = `<div class="sky-card rounded-2xl p-6 max-w-3xl mx-auto"><h2 class="text-xl font-light mb-4 text-white/80">Gizlilik Siyasəti</h2><p class="text-white/40 text-xs mb-4">Son yeniləmə: ${new Date().toLocaleDateString('az-AZ')}</p><p class="text-white/50 text-sm leading-relaxed mb-4">Nyx Astrology istifadəçilərin məlumatlarının məxfiliyinə hörmət edir. Bu sayt Google AdSense və Google Analytics istifadə edə bilər. Məlumatlarınız yalnız astrologiya xidmətləri üçün istifadə olunur və üçüncü tərəflərlə paylaşılmır.</p><p class="text-white/30 text-[10px] mt-4">Əlaqə: nyxastrology@example.com</p></div>`; }
function renderTerms() { const app = document.getElementById('app'); if(!app) return; app.innerHTML = `<div class="sky-card rounded-2xl p-6 max-w-3xl mx-auto"><h2 class="text-xl font-light mb-4 text-white/80">İstifadə Şərtləri</h2><p class="text-white/40 text-xs mb-4">Son yeniləmə: ${new Date().toLocaleDateString('az-AZ')}</p><p class="text-white/50 text-sm leading-relaxed mb-4">Nyx Astrology saytına daxil olmaqla bu şərtləri qəbul edirsiniz. Saytda təqdim olunan bütün məlumatlar yalnız əyləncə və informasiya məqsədlidir. Astrologiya proqnozları real həyat qərarları üçün əsas kimi istifadə edilməməlidir.</p></div>`; }
function renderContact() { const app = document.getElementById('app'); if(!app) return; app.innerHTML = `<div class="max-w-md mx-auto"><div class="sky-card rounded-2xl p-6"><h2 class="text-xl font-light mb-4 text-white/80 text-center">Əlaqə</h2><form id="contactForm" onsubmit="handleContact(event)"><div class="mb-4"><label class="block text-white/40 text-[10px] mb-1">ADINIZ</label><input type="text" id="contactName" class="dark-input w-full px-4 py-3 text-white/70 text-sm" required></div><div class="mb-4"><label class="block text-white/40 text-[10px] mb-1">E-POÇT</label><input type="email" id="contactEmail" class="dark-input w-full px-4 py-3 text-white/70 text-sm" required></div><div class="mb-5"><label class="block text-white/40 text-[10px] mb-1">MESAJ</label><textarea id="contactMessage" rows="4" class="dark-input w-full px-4 py-3 text-white/70 text-sm" required></textarea></div><button type="submit" class="w-full py-3 bg-blue-500/20 border border-blue-500/30 rounded-xl text-blue-300/70 text-[11px] hover:bg-blue-500/30 transition">GÖNDƏR</button></form><div id="contactSuccess" class="mt-4 text-center text-green-400/50 text-[10px] hidden">Mesaj göndərildi!</div></div></div>`; }

// ========== ƏLAVƏ FUNKSİYALAR ==========
function startJourney() {
    const name = document.getElementById('homeName')?.value;
    const date = document.getElementById('homeDate')?.value;
    if (!name || !date) { alert('Ad və doğum tarixi daxil edin'); return; }
    userName = name;
    birthdate = date;
    userSign = getZodiacSign(date);
    userSoulColor = getSoulColor(date);
    userSecretMessage = getSecretMessage(date, name);
    userSecretAbility = getSecretAbility(date, userSign);
    userKarmic = getKarmicConnection(date, userSign);
    userEnergy = getEnergyLevel(date, userSign);
    userStarFortune = getStarFortune(date, name);
    renderHome();
}

function resetJourney() {
    userName = ''; birthdate = ''; userSign = null; renderHome();
}

function calculateLoveCompatibility() {
    const partnerName = document.getElementById('partnerName')?.value;
    const partnerDate = document.getElementById('partnerDate')?.value;
    const loveResultDiv = document.getElementById('loveResult');
    if (!partnerName || !partnerDate || !userSign) { if(loveResultDiv) loveResultDiv.innerHTML = '<p class="text-white/30 text-[10px]">Məlumatları daxil edin</p>'; return; }
    const partnerSign = getZodiacSign(partnerDate);
    const comp = getLoveCompatibility(userSign, partnerSign);
    if(loveResultDiv) loveResultDiv.innerHTML = `<div class="bg-white/5 rounded-xl p-3 mt-2"><div class="text-center mb-2"><span class="text-2xl">${comp.score >= 75 ? '💜' : comp.score >= 55 ? '💖' : '💗'}</span></div><p class="text-white/60 text-[11px] text-center">${partnerName} ilə uyum: ${comp.score}%</p><p class="text-white/40 text-[10px] mt-2">${comp.analysis}</p><p class="text-blue-300/40 text-[9px] mt-1 text-center">${comp.verdict}</p></div>`;
}

function handleContact(e) { e.preventDefault(); const success = document.getElementById('contactSuccess'); if(success) { success.classList.remove('hidden'); document.getElementById('contactForm')?.reset(); setTimeout(() => success.classList.add('hidden'), 3000); } }

showPage('home');
</script>
</body>
</html>
