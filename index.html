function getDetailedHoroscope() {

function calculateHomeSign() {
    const name = document.getElementById('homeName')?.value;
    const date = document.getElementById('homeDate')?.value;
    if (!name || !date) return;
    userName = name;
    birthdate = date;
    userSign = getZodiacSign(date);
    showResult = true;
    currentPeriod = 'daily';
    currentCategory = 'general';
    renderHome();
}

function resetHome() {
    showResult = false;
    userName = '';
    birthdate = '';
    userSign = null;
    renderHome();
}

// ========== BÜRCÜ TAPMA ==========
function getZodiacSign(date) {
    if (!date) return signs[0];
    const month = parseInt(date.split('-')[1]);
    const day = parseInt(date.split('-')[2]);
    
    for (const sign of signs) {
        if (sign.startMonth === 1 && month === 12) {
            if ((month === 12 && day >= sign.startDay) || (month === 1 && day <= sign.endDay)) return sign;
        } else if (sign.startMonth <= sign.endMonth) {
            if (month === sign.startMonth && day >= sign.startDay) return sign;
            if (month === sign.endMonth && day <= sign.endDay) return sign;
            if (month > sign.startMonth && month < sign.endMonth) return sign;
        } else {
            if (month >= sign.startMonth || month <= sign.endMonth) return sign;
        }
    }
    return signs[9];
}

// ========== SƏHİFƏ NAVİQASİYASI ==========
function showPage(page) {
    const app = document.getElementById('app');
    if (!app) return;
    
    if (page === 'home') {
        showResult = false;
        renderHome();
    } else if (page === 'blog') {
        currentBlogIndex = -1;
        app.innerHTML = renderBlogList();
    } else if (page === 'privacy') {
        app.innerHTML = `<div class="sky-card rounded-2xl p-6 max-w-3xl mx-auto">${privacyPolicy}</div>`;
    } else if (page === 'terms') {
        app.innerHTML = `<div class="sky-card rounded-2xl p-6 max-w-3xl mx-auto">${termsOfService}</div>`;
    } else if (page === 'contact') {
        app.innerHTML = contactPage;
    }
    
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('text-blue-300/80');
        link.classList.add('text-blue-300/50');
    });
    const activeNav = document.getElementById(`nav-${page}`);
    if (activeNav) {
        activeNav.classList.remove('text-blue-300/50');
        activeNav.classList.add('text-blue-300/80');
    }
}

function showBlogPost(index) {
    const app = document.getElementById('app');
    if (app) {
        app.innerHTML = renderBlogPost(index);
    }
}

function handleContact(e) {
    e.preventDefault();
    const successDiv = document.getElementById('contactSuccess');
    if (successDiv) {
        successDiv.classList.remove('hidden');
        document.getElementById('contactForm')?.reset();
        setTimeout(() => {
            successDiv.classList.add('hidden');
        }, 3000);
    }
}

// ========== İNİALİZASİYA ==========
showPage('home');
