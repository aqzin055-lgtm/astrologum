                } else {
                    root.innerHTML = `
                        <div class="grid md:grid-cols-2 gap-6 animate-[fadeUp_0.5s]">
                            <div class="glass-panel p-6"><div class="flex gap-3 items-center border-b border-white/10 pb-3"><div><p class="text-indigo-300/60 text-xs">SALAM,</p><p class="text-2xl font-light">${currentUser.name}</p><p class="text-xs text-indigo-300/50">${currentUser.sign.name} · ${currentUser.sign.element} · ${currentUser.sign.ruler}</p></div></div><div class="mt-4 space-y-3"><div style="border-left:3px solid ${currentUser.soul.h}" class="pl-3"><p class="text-[9px] tracking-wide">Ruh rəngi</p><p class="font-medium">${currentUser.soul.n}</p><p class="text-[10px] opacity-60">${currentUser.soul.d}</p></div><div><p>⚡ Enerji səviyyəsi ${currentUser.energy}%</p><div class="h-1.5 w-full bg-white/10 rounded-full mt-1"><div class="h-full rounded-full bg-gradient-to-r from-indigo-400 to-purple-400 energy-progress" style="width:${currentUser.energy}%"></div></div></div><div><p>🔮 Gizli qabiliyyət: ${currentUser.ability.n} ${currentUser.ability.ico}</p><p class="text-[11px] opacity-70">${currentUser.ability.d}</p></div><div class="bg-white/5 rounded-xl p-2"><p class="italic text-sm">✨ "${currentUser.secretM}"</p></div></div></div>
                            <div class="glass-panel p-6"><h3 class="font-medium text-indigo-200 border-b border-white/10 pb-2">🌟 GÜNLÜK ASTRO PROQNOZ</h3><p class="mt-3 text-sm leading-relaxed">${dailyHoroscope(currentUser.sign, currentUser.name)}</p><hr class="my-4 opacity-20"><h4 class="text-xs uppercase tracking-wider">Bürc xüsusiyyətləri</h4><p class="text-xs mt-1">Sevgi: ${currentUser.sign.love} | Karyera: ${currentUser.sign.career} | Daş: ${currentUser.sign.gemstone}</p><button onclick="navigateTo('natal')" class="mt-5 text-xs bg-white/10 px-4 py-2 rounded-full hover:bg-white/20">Tam Natal Analiz →</button></div>
                            <div class="md:col-span-2 glass-panel p-5"><div class="flex justify-between items-center"><span class="text-indigo-300">💞 Sevgi uyumu testi</span><button onclick="navigateTo('love')" class="text-xs underline">Ətraflı uyum bölməsi</button></div><div class="flex flex-wrap gap-3 mt-2"><input type="text" id="partnerLoveName" placeholder="Partnyor adı" class="astro-input text-sm px-3 py-1"><input type="date" id="partnerLoveDate" class="astro-input text-sm px-3 py-1"><button onclick="quickLoveCalc()" class="bg-indigo-500/30 px-4 py-1 rounded-full text-xs">Uyum %</button></div><div id="quickLoveRes" class="text-xs mt-2 text-indigo-200/80"></div></div>
                        </div>
                        <div class="text-center mt-6"><button onclick="resetProfile()" class="border border-white/20 rounded-full px-5 py-1 text-[10px] hover:bg-white/10">⟳ profili sıfırla</button></div>
                    `;
                }
            }
            else if(activePage === 'natal') {
                if(!currentUser.sign) { root.innerHTML = `<div class="glass-panel p-8 text-center">Əvvəlcə ana səhifədə profili qurun.</div>`; return; }
                const place = document.getElementById('inputPlace')?.value || 'Bakı';
                const time = document.getElementById('inputTime')?.value || '12:00';
                const insight = getNatalInsight(currentUser.sign, place, time);
                root.innerHTML = `<div class="glass-panel p-7 max-w-3xl mx-auto"><h2 class="text-xl font-light">✨ Natal qrafik analiziniz ✨</h2><p class="text-sm mt-3 leading-relaxed">${insight}</p><div class="grid grid-cols-2 gap-4 mt-6 bg-black/20 p-4 rounded-2xl"><div><span class="text-indigo-300 text-[10px]">Günəş bürcü</span><p>${currentUser.sign.name}</p></div><div><span class="text-indigo-300 text-[10px]">Ay təxmini evi</span><p>${currentUser.sign.element} evi — emosiyalar</p></div><div><span class="text-indigo-300 text-[10px]">Yüksələn</span><p>${currentUser.sign.name === 'Qoç' ? 'Şir' : currentUser.sign.name === 'Buğa' ? 'Qız' : currentUser.sign.name} (orta hesablama)</p></div><div><span class="text-indigo-300 text-[10px]">Doğum yeri ulduz kodu</span><p>${place} ulduzlar altında güclü enerji</p></div></div><button onclick="navigateTo('home')" class="mt-6 text-sm border border-indigo-400/40 px-5 py-1.5 rounded-full">Ana səhifəyə qayıt</button></div>`;
            }
            else if(activePage === 'love') {
                root.innerHTML = `<div class="glass-panel p-7 max-w-2xl mx-auto"><h2 class="text-2xl font-light mb-2">💖 Sevgi Uyumu (Sinastri)</h2><p class="text-xs opacity-60 mb-5">İki bürc arasındakı ulduz bağını hesabla</p><div class="flex flex-col md:flex-row gap-4"><div><label class="text-[9px]">Sənin bürcün</label><select id="mySignSelect" class="astro-input p-2 w-full">${zodiacSigns.map(s=>`<option value="${s.name}" ${currentUser.sign && currentUser.sign.name===s.name ? 'selected' : ''}>${s.name}</option>`).join('')}</select></div><div><label class="text-[9px]">Partnyor bürcü</label><select id="partnerSignSelect" class="astro-input p-2 w-full">${zodiacSigns.map(s=>`<option value="${s.name}">${s.name}</option>`).join('')}</select></div><div class="flex items-end"><button onclick="computeLoveFromSelects()" class="bg-indigo-500/30 px-6 py-2 rounded-full text-sm">Uyumu gör</button></div></div><div id="loveFullResult" class="mt-6 text-center p-4 bg-white/5 rounded-2xl"></div></div>`;
            }
            else if(activePage === 'blog') {
                const fullBlogList = [...blogArticles];
                for(let i=0;i<12;i++) fullBlogList.push({ title: `${zodiacSigns[i].name} bürcünün gizli astrologiyası`, summary: `${zodiacSigns[i].traits} — dərin astroloji analiz.` });
                root.innerHTML = `<div class="glass-panel p-6"><h2 class="text-xl font-light mb-3">📚 Astroloji bilik xəzinəsi (35+ məqalə)</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-2">${fullBlogList.map((b,i)=>`<div class="border-l-2 border-indigo-400/30 pl-3 py-1"><h3 class="text-sm font-medium">${b.title}</h3><p class="text-[10px] opacity-60">${b.summary.substring(0,80)}...</p></div>`).join('')}</div></div>`;
            }
            else if(activePage === 'planets') {
                root.innerHTML = `<div class="glass-panel p-6 max-w-2xl mx-auto"><h2 class="text-xl font-light">🪐 Gələcək planet hadisələri</h2><div class="space-y-4 mt-5">${planetEvents.map(e=>`<div class="bg-black/20 p-4 rounded-xl"><p class="font-medium">${e.name} <span class="text-[10px] text-indigo-300">${e.date}</span></p><p class="text-sm">${e.effect}</p><p class="text-xs italic">✨ Tövsiyə: ${e.advice}</p></div>`).join('')}</div></div>`;
            }
            else if(activePage === 'horoscope') {
                if(!currentUser.sign) { root.innerHTML = `<div class="glass-panel p-6">Zəhmət olmasa ana səhifədə ad və doğum tarixini daxil edin.</div>`; return; }
                root.innerHTML = `<div class="glass-panel p-6 text-center"><h2 class="text-xl font-light">🔮 Günlük ulduz proqnozu (${currentUser.sign.name})</h2><p class="text-lg mt-5 leading-relaxed">${dailyHoroscope(currentUser.sign, currentUser.name)}</p><p class="text-xs mt-6 text-indigo-300/60">${currentUser.sign.tarot} kartı gücünüzü aktivləşdirir. Şanslı rəng: ${currentUser.sign.color}</p></div>`;
            }
        }

        // Qlobal funksiyalar
        window.startProfile = function() {
            const name = document.getElementById('inputName')?.value.trim();
            const birth = document.getElementById('inputBirth')?.value;
            if(!name || !birth) { alert('Ad və doğum tarixi daxil edin'); return; }
            const sign = getSignByDate(birth);
            const soul = soulColor(birth, name);
            const ability = secretAbility(sign, birth);
            const energy = energyLevel(sign, birth);
            const secretM = secretMsg(name, sign);
            currentUser = { name, birth, sign, soul, ability, energy, secretM };
            renderApp();
        };
        window.resetProfile = function() { currentUser = { name: '', birth: '', sign: null, soul: null, ability: null, energy: 60, secretM: '' }; renderApp(); };
        window.quickLoveCalc = function() {
            if(!currentUser.sign) return;
            let partnerName = document.getElementById('partnerLoveName')?.value;
            let partnerDate = document.getElementById('partnerLoveDate')?.value;
            if(!partnerDate) { document.getElementById('quickLoveRes').innerHTML = 'Partnyor tarixini daxil edin'; return; }
            let partnerSign = getSignByDate(partnerDate);
            let res = loveCompatibility(currentUser.sign, partnerSign);
            document.getElementById('quickLoveRes').innerHTML = `${partnerName || 'Partnyor'} ilə uyum: ${res.score}%<br><span class="text-[10px]">${res.advice}</span>`;
        };
        window.computeLoveFromSelects = function() {
            let mySignName = document.getElementById('mySignSelect')?.value;
            let partnerSignName = document.getElementById('partnerSignSelect')?.value;
            let mySign = zodiacSigns.find(s=>s.name===mySignName);
            let partnerSign = zodiacSigns.find(s=>s.name===partnerSignName);
            if(mySign && partnerSign) {
                let res = loveCompatibility(mySign, partnerSign);
                document.getElementById('loveFullResult').innerHTML = `<div class="text-3xl font-light">${res.score}%</div><p>${res.advice}</p><p class="text-xs mt-2">⭐ ${mySign.name} + ${partnerSign.name} ulduz bağı: ${res.score>70?'Ahəngdar titrəyişlər':'Öyrənməyə dəyər əlaqə'}</p>`;
            }
        };
        navigateTo('home');
    </script>
</body>
</html>
