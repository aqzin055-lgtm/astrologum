                            nextFocus: { en: "Somatic release and letting go of cognitive control.", ru: "Соматическое освобождение и отказ от когнитивного контроля.", az: "Somatik sərbəst buraxılma və koqnitiv nəzarəti buraxmaq." }
                        }
                    }
                ]
            }
        ];

        // --- COMPONENTS ---

        const Navbar = ({ lang, setLang }) => (
            <motion.nav 
                initial={{ y: -50, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                className="fixed w-full z-50 glass-panel border-b border-white/10 px-6 py-4 flex justify-between items-center"
            >
                <div className="flex items-center gap-2 cursor-pointer">
                    <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold shadow-[0_0_15px_rgba(99,102,241,0.5)]">A</div>
                    <span className="text-xl font-light tracking-widest text-white">ASTRALIS</span>
                </div>
                <div className="flex gap-6 items-center">
                    <select 
                        value={lang} 
                        onChange={(e) => setLang(e.target.value)}

                    >

                        <option value="ru" className="bg-gray-900">RU</option>

                    primary

                        : "glass-panel text-white hover:bg-white/10"

            >
                {children}
            </motion.button>

        const CosmicLoader = ({ texts, onComplete }) => {
            const [textIndex, setTextIndex] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setTextIndex(prev => (prev + 1) % texts.length);
                }, 1000);
                const timeout = setTimeout(() => {
                    onComplete();
                }, 4000);
                return () => {
                    clearInterval(interval);
                    clearTimeout(timeout);
                };
            }, [texts, onComplete]);

            return (
                <motion.div 
                    initial={{ opacity: 0 }} 
                    animate={{ opacity: 1 }} 
                    exit={{ opacity: 0 }}
                    className="fixed inset-0 z-50 bg-[#030712] flex flex-col items-center justify-center overflow-hidden"
                >
                    {/* Rotating Rings */}
                    <motion.div 
                        animate={{ rotate: 360 }} 
                        transition={{ duration: 10, repeat: Infinity, ease: "linear" }}
                        className="absolute w-64 h-64 border-[1px] border-indigo-500/30 rounded-full"
                    />
                    <motion.div 
                        animate={{ rotate: -360 }} 
                        transition={{ duration: 15, repeat: Infinity, ease: "linear" }}
                        className="absolute w-96 h-96 border-[1px] border-purple-500/20 rounded-full"
                    />
                    
                    {/* Core Sphere */}
                    <motion.div 
                        animate={{ scale: [1, 1.2, 1], opacity: [0.5, 1, 0.5] }}
                        transition={{ duration: 2, repeat: Infinity, ease: "easeInOut" }}
                        className="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full blur-xl mb-12"
                    />
                    
                    {/* Scanning Text */}
                    <AnimatePresence mode="wait">
                        <motion.p
                            key={textIndex}
                            initial={{ y: 10, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            exit={{ y: -10, opacity: 0 }}
                            className="text-gray-300 font-light tracking-widest text-lg"
                        >
                            {texts[textIndex]}
                        </motion.p>
                    </AnimatePresence>

                    {/* Progress Bar */}
                    <div className="w-64 h-1 bg-gray-800 rounded-full mt-8 overflow-hidden">
                        <motion.div 
                            initial={{ width: "0%" }}
                            animate={{ width: "100%" }}
                            transition={{ duration: 4, ease: "easeInOut" }}
                            className="h-full bg-gradient-to-r from-indigo-500 to-purple-500"
                        />
                    </div>
                </motion.div>
            );
        };

        const App = () => {

            const [view, setView] = useState('home'); // home, category, result
            const [activePanel, setActivePanel] = useState(null);

            const [isLoading, setIsLoading] = useState(false);

            const t = i18n[lang];

            const handlePanelClick = (panel) => {

                setView('category');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSubpanelClick = (subpanel) => {
                setActiveSubpanel(subpanel);
                setIsLoading(true);
            };

            return (
                <div className="min-h-screen text-gray-100 font-sans flex flex-col selection:bg-indigo-500/30 selection:text-white">
                    <Navbar lang={lang} setLang={setLang} />
                    
                    <main className="flex-grow pt-24 pb-20 px-6 max-w-7xl mx-auto w-full relative">
                        <AnimatePresence mode="wait">
                            {isLoading && (
                                <CosmicLoader 
                                    key="loader" 
                                    texts={t.loader} 
                                    onComplete={() => {
                                        setIsLoading(false);
                                        setView('result');

                                />
                            )}

                            {view === 'home' && !isLoading && (
                                <motion.div 
                                    key="home"
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -20 }}
                                    transition={{ duration: 0.8 }}
                                    className="flex flex-col items-center mt-20"
                                >
                                    <div className="text-center max-w-3xl mb-24">
                                        <motion.h1 
                                            initial={{ opacity: 0, y: 20 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ delay: 0.2, duration: 0.8 }}
                                            className="text-5xl md:text-7xl font-light tracking-tight mb-8 text-gradient leading-tight"
                                        >
                                            {t.hero.headline}
                                        </motion.h1>
                                        <motion.p 
                                            initial={{ opacity: 0 }}
                                            animate={{ opacity: 1 }}
                                            transition={{ delay: 0.4, duration: 0.8 }}
                                            className="text-xl text-gray-400 font-light mb-12 leading-relaxed"
                                        >
                                            {t.hero.subtitle}
                                        </motion.p>
                                        <motion.div 
                                            initial={{ opacity: 0 }}
                                            animate={{ opacity: 1 }}
                                            transition={{ delay: 0.6, duration: 0.8 }}
                                            className="flex flex-wrap justify-center gap-6"
                                        >
                                            <Button primary onClick={() => handlePanelClick(panels[0])}>{t.hero.cta}</Button>
                                            <Button onClick={() => {
                                                document.getElementById('panels').scrollIntoView({ behavior: 'smooth' });
                                            }}>{t.hero.secondary}</Button>
                                        </motion.div>
                                    </div>

                                    <div id="panels" className="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {panels.map((panel, idx) => (
                                            <motion.div
                                                key={panel.id}
                                                initial={{ opacity: 0, y: 30 }}
                                                animate={{ opacity: 1, y: 0 }}
                                                transition={{ delay: 0.2 + (idx * 0.1), duration: 0.6 }}
                                                whileHover={{ y: -10, scale: 1.02 }}
                                                className="glass-panel p-8 rounded-3xl cursor-pointer group hover:border-indigo-500/30 transition-all duration-500 relative overflow-hidden"
                                                onClick={() => handlePanelClick(panel)}
                                            >
                                                <div className="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                                                <div className="text-4xl mb-6 text-indigo-400 group-hover:text-white transition-colors duration-300">{panel.icon}</div>
                                                <h3 className="text-xl font-medium mb-3 tracking-wide">{panel.title[lang]}</h3>
                                                <p className="text-gray-400 text-sm font-light leading-relaxed">{panel.desc[lang]}</p>
                                            </motion.div>
                                        ))}
                                    </div>
                                </motion.div>
                            )}

                            {view === 'category' && activePanel && !isLoading && (
                                <motion.div
                                    key="category"
                                    initial={{ opacity: 0, x: 20 }}
                                    animate={{ opacity: 1, x: 0 }}
                                    exit={{ opacity: 0, x: -20 }}
                                    className="w-full mt-10"
                                >
                                    <button 
                                        onClick={() => setView('home')}
                                        className="text-gray-400 hover:text-white mb-12 flex items-center gap-2 transition-colors text-sm uppercase tracking-widest"
                                    >
                                        ← {t.ui.back}
                                    </button>
                                    
                                    <div className="mb-16">
                                        <div className="text-6xl text-indigo-400 mb-6">{activePanel.icon}</div>
                                        <h2 className="text-5xl font-light mb-4 text-gradient">{activePanel.title[lang]}</h2>

                                                className="glass-panel p-8 rounded-2xl cursor-pointer hover:bg-white/[0.05] transition-all duration-300 border border-white/5"
                                            >

                                                </div>

                            {view === 'result' && activeSubpanel && !isLoading && (
                                <motion.div
                                    key="result"
                                    initial={{ opacity: 0, scale: 0.95 }}

                                    exit={{ opacity: 0 }}
                                    transition={{ duration: 0.8, ease: "easeOut" }}
                                    className="w-full mt-10 max-w-4xl mx-auto"
                                >
                                    <button 
                                        onClick={() => setView('category')}
                                        className="text-gray-400 hover:text-white mb-10 flex items-center gap-2 transition-colors text-sm uppercase tracking-widest"
                                    >
                                        ← {t.ui.back}
                                    </button>

                                    <div className="glass-panel rounded-3xl p-10 md:p-16 relative overflow-hidden">
                                        {/* Background abstract glow */}
                                        <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2" />
                                        
                                        <div className="relative z-10">
                                            <h2 className="text-sm uppercase tracking-widest text-indigo-400 mb-4">{activeSubpanel.title[lang]}</h2>
                                            <p className="text-3xl md:text-4xl font-light leading-snug mb-12 text-gray-100">
                                                "{activeSubpanel.result.overview[lang]}"
                                            </p>

                                            <div className="space-y-12">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                    <div className="bg-white/5 p-6 rounded-2xl border border-white/5">
                                                        <h4 className="text-gray-400 text-sm uppercase tracking-widest mb-3">{t.result.strengths}</h4>
                                                        <p className="text-lg font-light">{activeSubpanel.result.strengths[lang]}</p>
                                                    </div>
                                                    <div className="bg-white/5 p-6 rounded-2xl border border-white/5">
                                                        <h4 className="text-gray-400 text-sm uppercase tracking-widest mb-3">{t.result.blindSpots}</h4>
                                                        <p className="text-lg font-light">{activeSubpanel.result.blindSpots[lang]}</p>
                                                    </div>
                                                </div>

                                                <div className="border-t border-white/10 pt-12">
                                                    <h4 className="text-gray-400 text-sm uppercase tracking-widest mb-4">{t.result.pattern}</h4>
                                                    <p className="text-2xl font-light text-gray-200">{activeSubpanel.result.pattern[lang]}</p>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-white/10 pt-12">
                                                    <div>
                                                        <h4 className="text-indigo-400 text-sm uppercase tracking-widest mb-3">{t.result.advice}</h4>
                                                        <p className="text-lg font-light text-gray-300">{activeSubpanel.result.advice[lang]}</p>
                                                    </div>
                                                    <div>
                                                        <h4 className="text-purple-400 text-sm uppercase tracking-widest mb-3">{t.result.symbolic}</h4>
                                                        <p className="text-lg font-light text-gray-300 italic">"{activeSubpanel.result.symbolic[lang]}"</p>
                                                    </div>
                                                </div>

                                                <div className="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 p-8 rounded-2xl border border-indigo-500/20 text-center mt-12">
                                                    <h4 className="text-gray-400 text-sm uppercase tracking-widest mb-3">{t.result.focus}</h4>
                                                    <p className="text-xl font-medium text-white">{activeSubpanel.result.nextFocus[lang]}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-white/5 py-8 text-center text-gray-500 text-sm font-light backdrop-blur-md bg-black/50 z-10 relative">
                        <p>© 2026 Astralis Inc. Designed with emotional intelligence.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
